    // ------------------------------------------------------------------
    // WEEKLY_DATA  — 14 weeks × 10 groups (realistic revenue with growth)
    // Base revenues differ by group maturity; expenses = 40–70% of revenue
    // ------------------------------------------------------------------
    (function() {
      // Seed revenues chosen to give each group a realistic growth arc
      const bases = [320, 280, 260, 400, 180, 310, 290, 240, 200, 450];
      const growthRates = [0.06, 0.08, 0.05, 0.04, 0.10, 0.07, 0.06, 0.09, 0.11, 0.03];
      const expenseRatios = [0.55, 0.60, 0.62, 0.48, 0.68, 0.57, 0.59, 0.63, 0.65, 0.45];
      // Simple seeded pseudo-random (deterministic)
      let seed = 42;
      const rand = () => { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return (seed >>> 0) / 0xffffffff; };
      const jitter = (v, pct) => v * (1 + (rand() - 0.5) * pct);

      window._WEEKLY_DATA_CONST = [];
      for (let g = 0; g < 10; g++) {
        let rev = bases[g];
        for (let w = 1; w <= 14; w++) {
          rev = rev * (1 + growthRates[g]) + jitter(0, 0.3) * bases[g] * 0.2;
          const revenue = Math.round(jitter(rev, 0.25) * 100) / 100;
          const expenses = Math.round(revenue * jitter(expenseRatios[g], 0.15) * 100) / 100;
          const netProfit = Math.round((revenue - expenses) * 100) / 100;
          const prevRev = w === 1 ? bases[g] : window._WEEKLY_DATA_CONST.find(r => r.groupId === `G${String(g+1).padStart(2,'0')}` && r.weekNo === w-1)?.revenue || bases[g];
          const salesGrowth = prevRev > 0 ? Math.round(((revenue - prevRev) / prevRev) * 10000) / 100 : 0;
          window._WEEKLY_DATA_CONST.push({
            weekNo: w,
            groupId: `G${String(g+1).padStart(2,'0')}`,
            revenue,
            expenses,
            netProfit,
            salesGrowth,
          });
        }
      }
    })();

    /* =====================================================================
     *  useLocalStorage — custom hook
     * ===================================================================== */
    function useLocalStorage(key, fallback) {
      const [value, setValueState] = React.useState(() => {
        try {
          const stored = localStorage.getItem(key);
          return stored !== null ? JSON.parse(stored) : fallback;
        } catch {
          return fallback;
        }
      });

      const setValue = React.useCallback((newVal) => {
        setValueState(prev => {
          const resolved = typeof newVal === 'function' ? newVal(prev) : newVal;
          try {
            localStorage.setItem(key, JSON.stringify(resolved));
          } catch {}
          return resolved;
        });
      }, [key]);

      return [value, setValue];
    }

    /* =====================================================================
     *  OverviewPage — full implementation
     * ===================================================================== */
    function OverviewPage() {
      // ── Load data from localStorage ──────────────────────────────────
      const students    = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_students'))    || []; } catch { return []; } }, []);
      const groups      = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_groups'))      || []; } catch { return []; } }, []);
      const projects    = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_projects'))    || []; } catch { return []; } }, []);
      const weeklyData  = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_weeklyData'))  || []; } catch { return []; } }, []);
      const assessments = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_assessments')) || []; } catch { return []; } }, []);
      const weights     = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_weights'))     || { quiz: 20, assignment: 30, project: 40, presentation: 10 }; } catch { return { quiz: 20, assignment: 30, project: 40, presentation: 10 }; } }, []);

      // ── Filters ───────────────────────────────────────────────────────
      const [selectedGroup, setSelectedGroup] = React.useState('All');
      const [weekFrom, setWeekFrom] = React.useState(1);
      const [weekTo, setWeekTo]     = React.useState(14);
      const [showRev, setShowRev]   = React.useState(true);
      const [showExp, setShowExp]   = React.useState(true);
      const [showNet, setShowNet]   = React.useState(true);

      // ── Modal state ───────────────────────────────────────────────────
      const [modal, setModal] = React.useState(null); // { title, columns, rows }

      // ── KPI computations ─────────────────────────────────────────────
      const totalStudents = students.length;
      const totalGroups   = groups.length;
      const activeProjects = projects.filter(p => p.status === 'Active').length;

      const totalRevenue  = weeklyData.reduce((s, r) => s + (r.revenue  || 0), 0);
      const totalExpenses = weeklyData.reduce((s, r) => s + (r.expenses || 0), 0);
      const totalNetProfit = totalRevenue - totalExpenses;

      const avgProjectCompletion = projects.length
        ? projects.reduce((s, p) => s + (p.businessProgress || 0), 0) / projects.length
        : 0;

      const avgAcademic = assessments.length
        ? assessments.reduce((s, a) => s + computeWeightedScore(a, weights), 0) / assessments.length
        : 0;

      // ── Modal detail helpers ──────────────────────────────────────────
      const openStudentsModal = () => setModal({
        title: 'All Students',
        columns: [
          { key: 'id',    label: 'ID',    bold: true },
          { key: 'name',  label: 'Name' },
          { key: 'class', label: 'Class' },
          { key: 'group', label: 'Group' },
        ],
        rows: students.map(s => ({ id: s.id, name: s.name, class: s.class, group: s.groupId })),
      });

      const openGroupsModal = () => setModal({
        title: 'Business Groups',
        columns: [
          { key: 'id',      label: 'Group', bold: true },
          { key: 'project', label: 'Project' },
          { key: 'members', label: 'Members' },
        ],
        rows: groups.map(g => {
          const proj = projects.find(p => p.id === g.projectId);
          return { id: g.id, project: proj ? proj.name : g.projectId, members: g.memberIds.join(', ') };
        }),
      });

      const openActiveProjectsModal = () => setModal({
        title: 'Active Business Projects',
        columns: [
          { key: 'name',     label: 'Project',  bold: true },
          { key: 'group',    label: 'Group' },
          { key: 'category', label: 'Category' },
          { key: 'progress', label: 'Progress', align: 'right' },
        ],
        rows: projects.filter(p => p.status === 'Active').map(p => ({
          name: p.name, group: p.groupId, category: p.category, progress: p.businessProgress + '%',
        })),
      });

      const openRevenueModal = () => {
        const byGroup = {};
        weeklyData.forEach(r => { byGroup[r.groupId] = (byGroup[r.groupId] || 0) + (r.revenue || 0); });
        setModal({
          title: 'Total Revenue by Group',
          columns: [
            { key: 'group',   label: 'Group', bold: true },
            { key: 'project', label: 'Project' },
            { key: 'revenue', label: 'Revenue', align: 'right' },
          ],
          rows: groups.map(g => {
            const proj = projects.find(p => p.id === g.projectId);
            return { group: g.id, project: proj ? proj.name : g.projectId, revenue: formatRM(byGroup[g.id] || 0) };
          }).sort((a, b) => b.revenue - a.revenue),
        });
      };

      const openExpensesModal = () => {
        const byGroup = {};
        weeklyData.forEach(r => { byGroup[r.groupId] = (byGroup[r.groupId] || 0) + (r.expenses || 0); });
        setModal({
          title: 'Total Expenses by Group',
          columns: [
            { key: 'group',    label: 'Group', bold: true },
            { key: 'project',  label: 'Project' },
            { key: 'expenses', label: 'Expenses', align: 'right' },
          ],
          rows: groups.map(g => {
            const proj = projects.find(p => p.id === g.projectId);
            return { group: g.id, project: proj ? proj.name : g.projectId, expenses: formatRM(byGroup[g.id] || 0) };
          }),
        });
      };

      const openNetProfitModal = () => {
        const revByGroup = {};
        const expByGroup = {};
        weeklyData.forEach(r => {
          revByGroup[r.groupId] = (revByGroup[r.groupId] || 0) + (r.revenue  || 0);
          expByGroup[r.groupId] = (expByGroup[r.groupId] || 0) + (r.expenses || 0);
        });
        setModal({
          title: 'Net Profit by Group',
          columns: [
            { key: 'group',     label: 'Group',      bold: true },
            { key: 'project',   label: 'Project' },
            { key: 'netProfit', label: 'Net Profit',  align: 'right' },
          ],
          rows: groups.map(g => {
            const proj = projects.find(p => p.id === g.projectId);
            const np = (revByGroup[g.id] || 0) - (expByGroup[g.id] || 0);
            return { group: g.id, project: proj ? proj.name : g.projectId, netProfit: formatRM(np) };
          }).sort((a, b) => {
            const parseRM = s => parseFloat(s.replace(/[^0-9.-]/g, ''));
            return parseRM(b.netProfit) - parseRM(a.netProfit);
          }),
        });
      };

      const openProgressModal = () => setModal({
        title: 'Project Completion Progress',
        columns: [
          { key: 'project',  label: 'Project',  bold: true },
          { key: 'status',   label: 'Status' },
          { key: 'progress', label: 'Progress', align: 'right' },
        ],
        rows: [...projects].sort((a, b) => b.businessProgress - a.businessProgress).map(p => ({
          project: p.name, status: p.status, progress: p.businessProgress + '%',
        })),
      });

      const openAcademicModal = () => {
        const byGroup = {};
        const countByGroup = {};
        assessments.forEach(a => {
          const st = students.find(s => s.id === a.studentId);
          if (!st) return;
          const score = computeWeightedScore(a, weights);
          byGroup[st.groupId] = (byGroup[st.groupId] || 0) + score;
          countByGroup[st.groupId] = (countByGroup[st.groupId] || 0) + 1;
        });
        setModal({
          title: 'Academic Performance by Group',
          columns: [
            { key: 'group',   label: 'Group',   bold: true },
            { key: 'project', label: 'Project' },
            { key: 'avg',     label: 'Avg Score (%)', align: 'right' },
          ],
          rows: groups.map(g => {
            const proj = projects.find(p => p.id === g.projectId);
            const avg = countByGroup[g.id] ? (byGroup[g.id] / countByGroup[g.id]) : 0;
            return { group: g.id, project: proj ? proj.name : g.projectId, avg: avg.toFixed(1) + '%' };
          }),
        });
      };

      // ── Chart refs ────────────────────────────────────────────────────
      const chartARef = React.useRef(null);
      const chartBRef = React.useRef(null);
      const chartCRef = React.useRef(null);
      const chartDRef = React.useRef(null);
      const chartAInstance = React.useRef(null);
      const chartBInstance = React.useRef(null);
      const chartCInstance = React.useRef(null);
      const chartDInstance = React.useRef(null);

      // Helper: filtered weekly data
      const getFilteredData = React.useCallback((gid) => {
        return weeklyData.filter(r =>
          r.weekNo >= weekFrom &&
          r.weekNo <= weekTo &&
          (gid === 'All' ? true : r.groupId === gid)
        );
      }, [weeklyData, weekFrom, weekTo]);

      // ── Chart A — Weekly Sales Line ───────────────────────────────────
      React.useEffect(() => {
        if (!chartARef.current || typeof Chart === 'undefined') return;
        if (chartAInstance.current) { chartAInstance.current.destroy(); chartAInstance.current = null; }

        const weeks = [];
        for (let w = weekFrom; w <= weekTo; w++) weeks.push(w);

        const revenueData = weeks.map(w => {
          const rows = weeklyData.filter(r => r.weekNo === w && (selectedGroup === 'All' || r.groupId === selectedGroup));
          return rows.reduce((s, r) => s + (r.revenue || 0), 0);
        });
        const expensesData = weeks.map(w => {
          const rows = weeklyData.filter(r => r.weekNo === w && (selectedGroup === 'All' || r.groupId === selectedGroup));
          return rows.reduce((s, r) => s + (r.expenses || 0), 0);
        });
        const netData = weeks.map((_, i) => revenueData[i] - expensesData[i]);

        const datasets = [];
        if (showRev) datasets.push({
          label: 'Revenue', data: revenueData,
          borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)',
          tension: 0.3, fill: false, pointRadius: 4,
        });
        if (showExp) datasets.push({
          label: 'Expenses', data: expensesData,
          borderColor: '#f97316', backgroundColor: 'rgba(249,115,22,0.1)',
          tension: 0.3, fill: false, pointRadius: 4,
        });
        if (showNet) datasets.push({
          label: 'Net Profit', data: netData,
          borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)',
          tension: 0.3, fill: false, pointRadius: 4,
        });

        chartAInstance.current = new Chart(chartARef.current, {
          type: 'line',
          data: { labels: weeks.map(w => 'Wk ' + w), datasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: ctx => ' ' + ctx.dataset.label + ': ' + formatRM(ctx.parsed.y),
                },
              },
            },
            scales: {
              x: { grid: { color: '#f1f5f9' } },
              y: {
                grid: { color: '#f1f5f9' },
                ticks: { callback: v => 'RM ' + v.toLocaleString('en-MY') },
              },
            },
          },
        });
        return () => { if (chartAInstance.current) { chartAInstance.current.destroy(); chartAInstance.current = null; } };
      }, [weeklyData, selectedGroup, weekFrom, weekTo, showRev, showExp, showNet]);

      // ── Chart B — Group Revenue Horizontal Bar ────────────────────────
      React.useEffect(() => {
        if (!chartBRef.current || typeof Chart === 'undefined') return;
        if (chartBInstance.current) { chartBInstance.current.destroy(); chartBInstance.current = null; }

        const filteredWD = getFilteredData('All');
        const byGroup = {};
        filteredWD.forEach(r => { byGroup[r.groupId] = (byGroup[r.groupId] || 0) + (r.revenue || 0); });

        const groupOrder = groups.map(g => g.id);
        const labels = groupOrder.map(gid => {
          const proj = projects.find(p => p.groupId === gid);
          return proj ? proj.name + ' (' + gid + ')' : gid;
        });
        const data = groupOrder.map(gid => byGroup[gid] || 0);
        const colours = [
          '#3b82f6','#22c55e','#f97316','#8b5cf6','#06b6d4',
          '#ec4899','#eab308','#14b8a6','#f43f5e','#6366f1',
        ];

        chartBInstance.current = new Chart(chartBRef.current, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label: 'Total Revenue',
              data,
              backgroundColor: colours,
              borderRadius: 4,
            }],

            indexAxis: 'y',
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: { label: ctx => ' ' + formatRM(ctx.parsed.x) },
              },
            },
            scales: {
              x: {
                grid: { color: '#f1f5f9' },
                ticks: { callback: v => 'RM ' + v.toLocaleString('en-MY') },
              },
              y: { grid: { display: false } },
            },
          },

        return () => { if (chartBInstance.current) { chartBInstance.current.destroy(); chartBInstance.current = null; } };

      // ── Chart C — Project Status Doughnut ─────────────────────────────
      React.useEffect(() => {
        if (!chartCRef.current || typeof Chart === 'undefined') return;
        if (chartCInstance.current) { chartCInstance.current.destroy(); chartCInstance.current = null; }

        const completed  = projects.filter(p => p.status === 'Completed').length;
        const inProgress = projects.filter(p => p.status === 'Active' || p.status === 'Planning').length;
        const notStarted = projects.filter(p => p.status === 'Not Started').length;

        chartCInstance.current = new Chart(chartCRef.current, {
          type: 'doughnut',
          data: {
            labels: ['Completed', 'In Progress', 'Not Started'],
            datasets: [{
              data: [completed, inProgress, notStarted],
              backgroundColor: ['#22c55e', '#3b82f6', '#94a3b8'],
              borderWidth: 2,
              borderColor: '#ffffff',
            }],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 12, padding: 10, font: { size: 11 } } },
              tooltip: {
                callbacks: { label: ctx => ' ' + ctx.label + ': ' + ctx.parsed + ' project(s)' },
              },
            },
          },
        });
        return () => { if (chartCInstance.current) { chartCInstance.current.destroy(); chartCInstance.current = null; } };
      }, [projects]);

      // ── Chart D — Academic Performance Bar ───────────────────────────
      React.useEffect(() => {
        if (!chartDRef.current || typeof Chart === 'undefined') return;
        if (chartDInstance.current) { chartDInstance.current.destroy(); chartDInstance.current = null; }

        const byGroup = {};
        const countByGroup = {};
        assessments.forEach(a => {
          const st = students.find(s => s.id === a.studentId);
          if (!st) return;
          const score = computeWeightedScore(a, weights);
          byGroup[st.groupId]      = (byGroup[st.groupId]      || 0) + score;
          countByGroup[st.groupId] = (countByGroup[st.groupId] || 0) + 1;
        });

        const labels = groups.map(g => {
          const proj = projects.find(p => p.groupId === g.id);
          return proj ? proj.name : g.id;
        });
        const data   = groups.map(g => countByGroup[g.id] ? +(byGroup[g.id] / countByGroup[g.id]).toFixed(1) : 0);
        const bgColours = data.map(v => v >= 65 ? '#22c55e' : v >= 50 ? '#f97316' : '#ef4444');

        chartDInstance.current = new Chart(chartDRef.current, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label: 'Avg Weighted Score (%)',
              data,
              backgroundColor: bgColours,
              borderRadius: 4,
            }],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: { label: ctx => ' Avg Score: ' + ctx.parsed.y.toFixed(1) + '%' },
              },
            },
            scales: {
              x: { grid: { display: false }, ticks: { font: { size: 10 } } },
              y: {
                min: 0, max: 100,
                grid: { color: '#f1f5f9' },
                ticks: { callback: v => v + '%' },
              },
            },
          },
        });
        return () => { if (chartDInstance.current) { chartDInstance.current.destroy(); chartDInstance.current = null; } };
      }, [assessments, students, groups, projects, weights]);

      // ── KPI cards config ──────────────────────────────────────────────
      const kpiCards = [
        {
          icon: '👥', label: 'Total Students', variant: 'blue',
          value: totalStudents.toString(),
          sublabel: groups.length + ' groups · ' + [new Set(students.map(s => s.class))].flat()[0] + ' & DPU4B',
          onClick: openStudentsModal,
        },
        {
          icon: '🏢', label: 'Total Business Groups', variant: 'teal',
          value: totalGroups.toString(),
          sublabel: '4 students per group',
          onClick: openGroupsModal,
        },
        {
          icon: '💼', label: 'Active Projects', variant: 'green',
          value: activeProjects.toString(),
          sublabel: projects.filter(p => p.status === 'Completed').length + ' completed · ' + projects.filter(p => p.status === 'Planning').length + ' planning',
          onClick: openActiveProjectsModal,
        },
        {
          icon: '💰', label: 'Total Sales Revenue', variant: 'blue',
          value: formatRM(totalRevenue),
          sublabel: 'Across all groups & weeks',
          onClick: openRevenueModal,
        },
        {
          icon: '🧾', label: 'Total Expenses', variant: 'amber',
          value: formatRM(totalExpenses),
          sublabel: 'Across all groups & weeks',
          onClick: openExpensesModal,
        },
        {
          icon: '📈', label: 'Total Net Profit', variant: totalNetProfit >= 0 ? 'green' : 'red',
          value: formatRM(totalNetProfit),
          sublabel: totalRevenue > 0 ? 'Margin: ' + ((totalNetProfit / totalRevenue) * 100).toFixed(1) + '%' : '',
          onClick: openNetProfitModal,
        },
        {
          icon: '🎯', label: 'Avg Project Completion', variant: 'purple',
          value: avgProjectCompletion.toFixed(1) + '%',
          sublabel: 'Average across ' + projects.length + ' projects',
          onClick: openProgressModal,
        },
        {
          icon: '🎓', label: 'Avg Academic Performance', variant: avgAcademic >= 65 ? 'green' : avgAcademic >= 50 ? 'amber' : 'red',
          value: avgAcademic.toFixed(1) + '%',
          sublabel: 'Weighted score · ' + assessments.length + ' students',
          onClick: openAcademicModal,
        },
      ];

      // ── Week options ──────────────────────────────────────────────────
      const weekOptions = Array.from({ length: 14 }, (_, i) => i + 1);

      // ── Render ────────────────────────────────────────────────────────
      return (
        <div className="space-y-6">
          {/* DEMO banner */}
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 text-xs text-amber-700 font-medium text-center">
            ⚠ DEMO DATA — For Teaching and Demonstration Purposes Only
          </div>

          {/* KPI Cards */}
          <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {kpiCards.map((card, i) => (
              <KpiCard key={i} {...card} />
            ))}
          </div>

          {/* Filters */}
          <div className="bg-white rounded-xl shadow-sm border border-slate-200 px-5 py-4">
            <div className="flex flex-wrap items-center gap-4">
              <div className="flex items-center gap-2 text-sm font-medium text-slate-600">
                <span>🔍</span> Filters:
              </div>

              {/* Group filter */}
              <div className="flex items-center gap-2">
                <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Group</label>
                <select
                  value={selectedGroup}
                  onChange={e => setSelectedGroup(e.target.value)}
                  className="text-sm border border-slate-300 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"
                >
                  <option value="All">All Groups</option>
                  {groups.map(g => {
                    const proj = projects.find(p => p.groupId === g.id);
                    return <option key={g.id} value={g.id}>{g.id} — {proj ? proj.name : '—'}</option>;
                  })}
                </select>
              </div>

              {/* Week From */}
              <div className="flex items-center gap-2">
                <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Week From</label>
                <select
                  value={weekFrom}
                  onChange={e => { const v = Number(e.target.value); setWeekFrom(v); if (v > weekTo) setWeekTo(v); }}
                  className="text-sm border border-slate-300 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"
                >
                  {weekOptions.map(w => <option key={w} value={w}>Week {w}</option>)}
                </select>
              </div>

              {/* Week To */}
              <div className="flex items-center gap-2">
                <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Week To</label>
                <select
                  value={weekTo}
                  onChange={e => { const v = Number(e.target.value); setWeekTo(v); if (v < weekFrom) setWeekFrom(v); }}
                  className="text-sm border border-slate-300 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400"
                >
                  {weekOptions.map(w => <option key={w} value={w}>Week {w}</option>)}
                </select>
              </div>

              {/* Reset */}
              <button
                onClick={() => { setSelectedGroup('All'); setWeekFrom(1); setWeekTo(14); }}
                className="text-xs text-blue-600 hover:text-blue-800 font-medium underline"
              >
                Reset
              </button>
            </div>
          </div>

          {/* Charts row 1: Chart A + Chart B */}
          <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
            {/* Chart A — Weekly Sales */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <div>
                  <h3 className="font-bold text-slate-800 text-sm">Weekly Sales Performance</h3>
                  <p className="text-xs text-slate-400 mt-0.5">
                    {selectedGroup === 'All' ? 'All Groups' : selectedGroup + ' — ' + (projects.find(p => p.groupId === selectedGroup)?.name || '')}
                    {' · '}Week {weekFrom}–{weekTo}
                  </p>
                </div>
                {/* Dataset toggles */}
                <div className="flex flex-wrap gap-3">
                  {[
                    { label: 'Revenue',    colour: '#3b82f6', state: showRev, toggle: () => setShowRev(v => !v) },
                    { label: 'Expenses',   colour: '#f97316', state: showExp, toggle: () => setShowExp(v => !v) },
                    { label: 'Net Profit', colour: '#22c55e', state: showNet, toggle: () => setShowNet(v => !v) },
                  ].map(({ label, colour, state, toggle }) => (
                    <label key={label} className="flex items-center gap-1.5 cursor-pointer select-none text-xs font-medium text-slate-600">
                      <input
                        type="checkbox"
                        checked={state}
                        onChange={toggle}
                        className="w-3.5 h-3.5 rounded"
                        style={{ accentColor: colour }}
                      />
                      <span style={{ color: state ? colour : '#94a3b8' }}>{label}</span>
                    </label>
                  ))}
                </div>
              </div>
              <div style={{ height: '260px', position: 'relative' }}>
                <canvas ref={chartARef}></canvas>
              </div>
            </div>

            {/* Chart B — Group Revenue Bar */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
              <div className="mb-4">
                <h3 className="font-bold text-slate-800 text-sm">Business Group Revenue Comparison</h3>
                <p className="text-xs text-slate-400 mt-0.5">Total revenue per group · Week {weekFrom}–{weekTo}</p>
              </div>
              <div style={{ height: '260px', position: 'relative' }}>
                <canvas ref={chartBRef}></canvas>
              </div>
            </div>
          </div>

          {/* Charts row 2: Chart C + Chart D */}
          <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
            {/* Chart C — Project Status Doughnut */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
              <div className="mb-4">
                <h3 className="font-bold text-slate-800 text-sm">Project Completion Status</h3>
                <p className="text-xs text-slate-400 mt-0.5">{projects.length} projects total</p>
              </div>
              <div className="flex items-center justify-center" style={{ height: '260px', position: 'relative' }}>
                <canvas ref={chartCRef}></canvas>
              </div>
            </div>

            {/* Chart D — Academic Performance Bar */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
              <div className="flex items-start justify-between mb-4">
                <div>
                  <h3 className="font-bold text-slate-800 text-sm">Student Academic Performance by Group</h3>
                  <p className="text-xs text-slate-400 mt-0.5">Weighted average score per group</p>
                </div>
                <div className="flex gap-2 text-xs font-medium flex-shrink-0 mt-0.5">
                  <span className="flex items-center gap-1"><span className="inline-block w-2.5 h-2.5 rounded-sm bg-green-500"></span>≥65%</span>
                  <span className="flex items-center gap-1"><span className="inline-block w-2.5 h-2.5 rounded-sm bg-orange-500"></span>50–64%</span>
                  <span className="flex items-center gap-1"><span className="inline-block w-2.5 h-2.5 rounded-sm bg-red-500"></span>&lt;50%</span>
                </div>
              </div>
              <div style={{ height: '260px', position: 'relative' }}>
                <canvas ref={chartDRef}></canvas>
              </div>
            </div>
          </div>

          {/* KPI Detail Modal */}
          {modal && (
            <KpiDetailModal
              title={modal.title}
              columns={modal.columns}
              rows={modal.rows}
              onClose={() => setModal(null)}
            />
          )}
        </div>
      );
    }

    /* =====================================================================
     *  computeWeightedScore  (shared utility for Students page)
     * ===================================================================== */
    function computeWeightedScore(a, weights) {
      const wQ  = (weights.quiz         || 20) / 100;
      const wA  = (weights.assignment   || 30) / 100;
      const wP  = (weights.project      || 40) / 100;
      const wPr = (weights.presentation || 10) / 100;
      return (
        ((a.quiz         || 0) / 100) * wQ  * 100 +
        ((a.assignment   || 0) / 100) * wA  * 100 +
        ((a.project      || 0) / 100) * wP  * 100 +
        ((a.presentation || 0) / 100) * wPr * 100
      );
    }

    function getGrade(score) {
      if (score >= 80) return 'A';
      if (score >= 65) return 'B';
      if (score >= 50) return 'C';
      if (score >= 40) return 'D';
      return 'F';
    }

    /* =====================================================================
     *  ModalShell — generic modal wrapper
     * ===================================================================== */
    function ModalShell({ title, onClose, children, wide }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div className="absolute inset-0 bg-black/50" onClick={onClose} />
          <div className={`relative bg-white rounded-2xl shadow-2xl w-full ${wide ? 'max-w-3xl' : 'max-w-lg'} max-h-[92vh] flex flex-col z-10 my-auto`}>
            <div className="flex items-center justify-between px-5 py-4 border-b border-slate-200 flex-shrink-0">
              <h3 className="font-bold text-slate-800 text-base">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            <div className="overflow-y-auto flex-1 p-5">{children}</div>
          </div>
        </div>
      );
    }

    /* =====================================================================
     *  StudentProfileModal
     * ===================================================================== */
    function StudentProfileModal({ student, onClose }) {
      const assessments = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_assessments')) || []; } catch { return []; } }, []);
      const weights     = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_weights')) || { quiz:20, assignment:30, project:40, presentation:10 }; } catch { return { quiz:20, assignment:30, project:40, presentation:10 }; } }, []);
      const groups      = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_groups')) || []; } catch { return []; } }, []);
      const allStudents = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_students')) || []; } catch { return []; } }, []);
      const projects    = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_projects')) || []; } catch { return []; } }, []);
      const weeklyStatus= React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_studentWeeklyStatus')) || {}; } catch { return {}; } }, []);

      const assess = assessments.find(a => a.studentId === student.id) || { quiz:0, assignment:0, project:0, presentation:0 };
      const weighted = computeWeightedScore(assess, weights);
      const grade    = getGrade(weighted);

      const group    = groups.find(g => g.id === student.groupId);
      const project  = projects.find(p => p.id === group?.projectId);
      const members  = group ? group.memberIds.map(id => allStudents.find(s => s.id === id)).filter(Boolean) : [];

      // weekly progress
      const totalWeeks = 14;
      let submitted = 0, completed = 0;
      for (let w = 1; w <= totalWeeks; w++) {
        const key = `${student.id}_${w}`;
        const s = weeklyStatus[key]?.status;
        if (s === 'Submitted') submitted++;
        if (s === 'Completed') completed++;
      }

      return (
        <ModalShell title={`Student Profile — ${student.id}`} onClose={onClose} wide>
          {/* Basic info */}
          <div className="grid grid-cols-2 gap-3 mb-5">
            {[
              ['Student ID',       student.id],
              ['Full Name',        student.name],
              ['Class',            student.class],
              ['Group',            student.groupId],
              ['Business Project', project?.name || '—'],
              ['Category',         project?.category || '—'],
            ].map(([k, v]) => (
              <div key={k} className="bg-slate-50 rounded-lg p-3">
                <p className="text-xs text-slate-500 font-medium mb-0.5">{k}</p>
                <p className="text-sm font-semibold text-slate-800">{v}</p>
              </div>
            ))}
          </div>

          {/* Assessment scores */}
          <h4 className="font-semibold text-slate-700 text-sm mb-2">Academic Assessment</h4>
          <div className="rounded-lg border border-slate-200 overflow-hidden mb-5">
            <table className="w-full text-sm">
              <thead className="bg-slate-50">
                <tr>
                  {['Component', 'Weight', 'Score', 'Contribution'].map(h => (
                    <th key={h} className="px-3 py-2 text-xs font-semibold text-slate-500 uppercase text-left">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[
                  { label: 'Quiz',         key: 'quiz',         w: weights.quiz },
                  { label: 'Assignment',   key: 'assignment',   w: weights.assignment },
                  { label: 'Project',      key: 'project',      w: weights.project },
                  { label: 'Presentation', key: 'presentation', w: weights.presentation },
                ].map(row => {
                  const contribution = ((assess[row.key] || 0) / 100) * (row.w / 100) * 100;
                  return (
                    <tr key={row.key} className="border-t border-slate-100 hover:bg-slate-50">
                      <td className="px-3 py-2 font-medium text-slate-700">{row.label}</td>
                      <td className="px-3 py-2 text-slate-500">{row.w}%</td>
                      <td className="px-3 py-2 text-slate-800 font-semibold">{assess[row.key] || 0}</td>
                      <td className="px-3 py-2 text-slate-600">{contribution.toFixed(1)}</td>
                    </tr>
                  );
                })}
                <tr className="border-t-2 border-slate-300 bg-slate-50">
                  <td className="px-3 py-2 font-bold text-slate-800" colSpan={2}>Weighted Total</td>
                  <td className="px-3 py-2 font-bold text-slate-800">{weighted.toFixed(1)}%</td>
                  <td className="px-3 py-2">
                    <span className={`inline-block text-xs font-bold px-2 py-0.5 rounded-full
                      ${grade === 'A' ? 'bg-green-100 text-green-700' :
                        grade === 'B' ? 'bg-blue-100 text-blue-700' :
                        grade === 'C' ? 'bg-amber-100 text-amber-700' :
                        grade === 'D' ? 'bg-orange-100 text-orange-700' :
                        'bg-red-100 text-red-700'}`}>
                      Grade {grade}
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          {/* Weekly progress */}
          <h4 className="font-semibold text-slate-700 text-sm mb-2">Weekly Progress Summary</h4>
          <div className="grid grid-cols-3 gap-3 mb-5">
            {[
              { label: 'Completed',   val: completed,              colour: 'text-green-600 bg-green-50' },
              { label: 'Submitted',   val: submitted,              colour: 'text-blue-600 bg-blue-50' },
              { label: 'Remaining',   val: totalWeeks - completed - submitted, colour: 'text-slate-600 bg-slate-50' },
            ].map(item => (
              <div key={item.label} className={`rounded-lg p-3 text-center ${item.colour}`}>
                <p className="text-2xl font-bold">{item.val}</p>
                <p className="text-xs font-medium mt-0.5">{item.label}</p>
                <p className="text-xs opacity-70">of {totalWeeks} weeks</p>
              </div>
            ))}
          </div>

          {/* Group members */}
          <h4 className="font-semibold text-slate-700 text-sm mb-2">Group Members — {student.groupId}</h4>
          <div className="space-y-1.5">
            {members.map(m => (
              <div key={m.id} className={`flex items-center justify-between rounded-lg px-3 py-2 text-sm
                ${m.id === student.id ? 'bg-teal-50 border border-teal-200' : 'bg-slate-50'}`}>
                <span className="font-medium text-slate-800">{m.name}</span>
                <span className="text-slate-500 text-xs">{m.id}</span>

    /* =====================================================================
     *  StudentsPage — full implementation
     * ===================================================================== */
    function StudentsPage() {
      const { role, currentUser } = useApp();

      // ── localStorage state ────────────────────────────────────────────
      const [students,    setStudents]    = useLocalStorage('dep_students',    []);
      const [assessments, setAssessments] = useLocalStorage('dep_assessments', []);
      const weights = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_weights')) || { quiz:20, assignment:30, project:40, presentation:10 }; } catch { return { quiz:20, assignment:30, project:40, presentation:10 }; } }, []);
      const groups  = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_groups'))  || []; } catch { return []; } }, []);
      const projects= React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_projects'))|| []; } catch { return []; } }, []);

      // ── Student view: only show own row ───────────────────────────────
      const visibleStudents = role === 'student'
        ? students.filter(s => s.id === currentUser?.id)
        : students;

      // ── Active tab ────────────────────────────────────────────────────
      const [activeTab, setActiveTab] = React.useState('students');

      // ── Search / filter / sort state ──────────────────────────────────
      const [search,      setSearch]      = React.useState('');
      const [filterGroup, setFilterGroup] = React.useState('All');
      const [filterClass, setFilterClass] = React.useState('All');
      const [sortKey,     setSortKey]     = React.useState('id');
      const [sortDir,     setSortDir]     = React.useState('asc');
      const [page,        setPage]        = React.useState(1);
      const PAGE_SIZE = 10;

      // ── Modal state ───────────────────────────────────────────────────
      const [viewModal,   setViewModal]   = React.useState(null);  // student object
      const [editModal,   setEditModal]   = React.useState(null);  // student object
      const [addModal,    setAddModal]    = React.useState(false);
      const [groupModal,  setGroupModal]  = React.useState(null);  // group object

      // ── Compute weighted score for each student ───────────────────────
      const withScores = React.useMemo(() => {
        return visibleStudents.map(s => {
          const a = assessments.find(x => x.studentId === s.id) || { quiz:0, assignment:0, project:0, presentation:0 };
          const ws = computeWeightedScore(a, weights);
          const project = groups.find(g => g.id === s.groupId);
          const proj = projects.find(p => p.id === project?.projectId);
          return { ...s, weightedScore: ws, projectName: proj?.name || '—' };
        });
      }, [visibleStudents, assessments, weights, groups, projects]);

      // ── Filter ────────────────────────────────────────────────────────
      const filtered = React.useMemo(() => {
        const q = search.toLowerCase();
        return withScores.filter(s => {
          if (filterGroup !== 'All' && s.groupId !== filterGroup) return false;
          if (filterClass !== 'All' && s.class !== filterClass) return false;
          if (q && !s.id.toLowerCase().includes(q) && !s.name.toLowerCase().includes(q)) return false;
          return true;
        });
      }, [withScores, search, filterGroup, filterClass]);

      // ── Sort ──────────────────────────────────────────────────────────
      const sorted = React.useMemo(() => {
        return [...filtered].sort((a, b) => {
          let va = a[sortKey], vb = b[sortKey];
          if (typeof va === 'string') va = va.toLowerCase();
          if (typeof vb === 'string') vb = vb.toLowerCase();
          if (va < vb) return sortDir === 'asc' ? -1 : 1;
          if (va > vb) return sortDir === 'asc' ?  1 : -1;
          return 0;
        });
      }, [filtered, sortKey, sortDir]);

      // ── Pagination ────────────────────────────────────────────────────
      const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
      const paginated  = sorted.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

      // ── Reset page on filter change ───────────────────────────────────
      React.useEffect(() => { setPage(1); }, [search, filterGroup, filterClass, sortKey, sortDir]);

      // ── Sort toggle ───────────────────────────────────────────────────
      const toggleSort = (key) => {
        if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortKey(key); setSortDir('asc'); }
      };

      const SortIcon = ({ col }) => {
        if (sortKey !== col) return <span className="ml-1 text-slate-300">⇅</span>;
        return <span className="ml-1">{sortDir === 'asc' ? '↑' : '↓'}</span>;
      };

      // ── CRUD handlers ─────────────────────────────────────────────────
      const handleEditSave = ({ student: updStu, assess: updAss }) => {
        // Update student list
        setStudents(prev => prev.map(s => s.id === updStu.id ? updStu : s));
        // Update assessments
        setAssessments(prev => {
          const exists = prev.find(a => a.studentId === updAss.studentId);
          return exists ? prev.map(a => a.studentId === updAss.studentId ? updAss : a) : [...prev, updAss];
        });
        // Also update groups memberIds if group changed
        const origStu = students.find(s => s.id === updStu.id);
        if (origStu && origStu.groupId !== updStu.groupId) {
          const grpRaw = JSON.parse(localStorage.getItem('dep_groups')) || [];
          const newGrps = grpRaw.map(g => {
            if (g.id === origStu.groupId) return { ...g, memberIds: g.memberIds.filter(id => id !== updStu.id) };
            if (g.id === updStu.groupId)  return { ...g, memberIds: [...g.memberIds, updStu.id] };
            return g;
          });
          localStorage.setItem('dep_groups', JSON.stringify(newGrps));
        }
        setEditModal(null);
      };

      const handleDelete = (studentId) => {
        const stu = students.find(s => s.id === studentId);
        if (stu) {
          // Remove from group memberIds
          const grpRaw = JSON.parse(localStorage.getItem('dep_groups')) || [];
          const newGrps = grpRaw.map(g => ({ ...g, memberIds: g.memberIds.filter(id => id !== studentId) }));
          localStorage.setItem('dep_groups', JSON.stringify(newGrps));
        }
        setStudents(prev => prev.filter(s => s.id !== studentId));
        setAssessments(prev => prev.filter(a => a.studentId !== studentId));
        setEditModal(null);
      };

      const handleAddSave = ({ student: newStu, assess: newAss }) => {
        setStudents(prev => [...prev, newStu]);
        setAssessments(prev => [...prev, newAss]);
        // Add to group
        const grpRaw = JSON.parse(localStorage.getItem('dep_groups')) || [];
        const newGrps = grpRaw.map(g => g.id === newStu.groupId ? { ...g, memberIds: [...g.memberIds, newStu.id] } : g);
        localStorage.setItem('dep_groups', JSON.stringify(newGrps));
        setAddModal(false);
      };

      // ── Groups tab data ───────────────────────────────────────────────
      const groupsData = React.useMemo(() => {
        const weeklyData = (() => { try { return JSON.parse(localStorage.getItem('dep_weeklyData')) || []; } catch { return []; } })();
        const freshStudents = JSON.parse(localStorage.getItem('dep_students') || '[]');
        return groups.map(g => {
          const proj = projects.find(p => p.id === g.projectId);
          const members = g.memberIds.map(id => freshStudents.find(s => s.id === id)).filter(Boolean);
          const gWD = weeklyData.filter(r => r.groupId === g.id);
          const totalRev = gWD.reduce((s, r) => s + r.revenue, 0);
          const totalNet = gWD.reduce((s, r) => s + r.netProfit, 0);
          const memberAssess = members.map(m => assessments.find(a => a.studentId === m.id) || { quiz:0, assignment:0, project:0, presentation:0 });
          const avgScore = memberAssess.length ? memberAssess.reduce((s, a) => s + computeWeightedScore(a, weights), 0) / memberAssess.length : 0;
          return { ...g, project: proj, members, totalRev, totalNet, avgScore };
        });
      }, [groups, projects, assessments, weights, students]);

      // ── Render ────────────────────────────────────────────────────────
      return (
        <div className="space-y-5">
          {/* DEMO banner */}
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 text-xs text-amber-700 font-medium text-center">
            ⚠ DEMO DATA — For Teaching and Demonstration Purposes Only
          </div>

          {/* Tabs */}
          <div className="flex gap-1 bg-white rounded-xl p-1 border border-slate-200 shadow-sm w-fit">
            {[
              { id: 'students', label: '👥 Students' },
              { id: 'groups',   label: '🏢 Groups'   },
            ].map(t => (
              <button key={t.id} onClick={() => setActiveTab(t.id)}
                className={`px-5 py-2 text-sm font-medium rounded-lg transition-colors
                  ${activeTab === t.id ? 'bg-[#1e3a5f] text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}>
                {t.label}
              </button>
            ))}
          </div>

          {/* ── STUDENTS TAB ────────────────────────────────────────── */}
          {activeTab === 'students' && (
            <div className="bg-white rounded-xl shadow-sm border border-slate-200">
              {/* Toolbar */}
              <div className="flex flex-wrap items-center gap-3 px-5 py-4 border-b border-slate-200">
                <div className="flex-1 min-w-[180px]">
                  <input
                    placeholder="Search by name or ID…"
                    value={search} onChange={e => setSearch(e.target.value)}
                    className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                  />
                </div>

                {role === 'lecturer' && (
                  <>
                    <select value={filterGroup} onChange={e => setFilterGroup(e.target.value)}
                      className="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                      <option value="All">All Groups</option>
                      {groups.map(g => <option key={g.id} value={g.id}>{g.id}</option>)}
                    </select>

                    <select value={filterClass} onChange={e => setFilterClass(e.target.value)}
                      className="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                      <option value="All">All Classes</option>
                      <option value="DPU4A">DPU4A</option>
                      <option value="DPU4B">DPU4B</option>
                    </select>

                    <button onClick={() => setAddModal(true)}
                      className="ml-auto flex items-center gap-2 bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors flex-shrink-0">
                      <span>+</span> Add Student
                    </button>
                  </>
                )}
              </div>

              {/* Table */}
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead className="bg-slate-50 border-b border-slate-200">
                    <tr>
                      {[
                        { key: 'id',            label: 'Student ID'       },
                        { key: 'name',          label: 'Name'             },
                        { key: 'class',         label: 'Class'            },
                        { key: 'groupId',       label: 'Group',  noSort: true },
                        { key: 'projectName',   label: 'Business Project', noSort: true },
                        { key: 'weightedScore', label: 'Weighted Score'   },
                        { key: 'status',        label: 'Status',  noSort: true },
                        { key: 'actions',       label: 'Actions', noSort: true },
                      ].map(col => (
                        <th key={col.key}
                          className={`px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap
                            ${!col.noSort ? 'cursor-pointer hover:text-slate-700 select-none' : ''}`}
                          onClick={() => !col.noSort && toggleSort(col.key)}>
                          {col.label}
                          {!col.noSort && <SortIcon col={col.key} />}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {paginated.length === 0 && (
                      <tr>
                        <td colSpan={8} className="px-4 py-8 text-center text-slate-400">No students found.</td>
                      </tr>
                    )}
                    {paginated.map(s => {
                      const isAtRisk = s.weightedScore < 50;
                      return (
                        <tr key={s.id} className="border-t border-slate-100 hover:bg-slate-50 transition-colors">
                          <td className="px-4 py-3 font-mono text-xs text-slate-600 whitespace-nowrap">{s.id}</td>
                          <td className="px-4 py-3 font-medium text-slate-800">{s.name}</td>
                          <td className="px-4 py-3 text-slate-600">{s.class}</td>
                          <td className="px-4 py-3">
                            <span className="inline-block bg-slate-100 text-slate-700 text-xs font-semibold px-2 py-0.5 rounded-full">{s.groupId}</span>
                          </td>
                          <td className="px-4 py-3 text-slate-600 max-w-[140px] truncate">{s.projectName}</td>
                          <td className="px-4 py-3 font-semibold text-slate-800">{s.weightedScore.toFixed(1)}%</td>
                          <td className="px-4 py-3">
                            {isAtRisk
                              ? <span className="inline-block bg-red-100 text-red-700 text-xs font-semibold px-2 py-0.5 rounded-full">At Risk</span>
                              : <span className="inline-block bg-green-100 text-green-700 text-xs font-semibold px-2 py-0.5 rounded-full">Active</span>
                            }
                          </td>
                          <td className="px-4 py-3">
                            <div className="flex items-center gap-2">
                              <button onClick={() => setViewModal(s)}
                                className="text-xs bg-[#1e3a5f] text-white px-3 py-1.5 rounded-lg hover:bg-[#16304f] transition-colors">
                                View
                              </button>
                              {role === 'lecturer' && (
                                <button onClick={() => setEditModal(students.find(x => x.id === s.id) || s)}
                                  className="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-200 transition-colors">
                                  Edit
                                </button>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              {/* Pagination */}
              <div className="flex items-center justify-between px-5 py-3 border-t border-slate-200 text-sm text-slate-500">
                <span>
                  Showing {sorted.length === 0 ? 0 : (page - 1) * PAGE_SIZE + 1}–{Math.min(page * PAGE_SIZE, sorted.length)} of {sorted.length} student{sorted.length !== 1 ? 's' : ''}
                </span>
                <div className="flex items-center gap-2">
                  <button onClick={() => setPage(p => Math.max(1, p - 1))} disabled={page === 1}
                    className="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                    ← Prev
                  </button>
                  <span className="text-xs font-medium">Page {page} / {totalPages}</span>
                  <button onClick={() => setPage(p => Math.min(totalPages, p + 1))} disabled={page === totalPages}
                    className="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                    Next →
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ── GROUPS TAB ──────────────────────────────────────────── */}
          {activeTab === 'groups' && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              {groupsData.map(g => {
                const statusColour = {
                  Active:    'bg-green-100 text-green-700',
                  Planning:  'bg-amber-100 text-amber-700',
                  Completed: 'bg-blue-100 text-blue-700',
                  'Not Started': 'bg-slate-100 text-slate-600',
                }[g.project?.status] || 'bg-slate-100 text-slate-600';

                return (
                  <div key={g.id} className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                    {/* Header */}
                    <div className="flex items-start justify-between mb-3">
                      <div>
                        <h3 className="font-bold text-slate-800 text-base">{g.id} — {g.project?.name || '—'}</h3>
                        <p className="text-xs text-slate-500 mt-0.5">{g.project?.category || '—'}</p>
                      </div>
                      {g.project && (
                        <span className={`text-xs font-semibold px-2 py-0.5 rounded-full flex-shrink-0 ml-2 ${statusColour}`}>
                          {g.project.status}
                        </span>
                      )}
                    </div>

                    {/* Members */}
                    <div className="space-y-1 mb-4">
                      {g.members.map(m => (
                        <div key={m.id} className="flex items-center justify-between text-xs bg-slate-50 rounded-lg px-3 py-1.5">
                          <span className="font-medium text-slate-700">{m.name}</span>
                          <span className="text-slate-400">{m.id}</span>
                        </div>
                      ))}
                    </div>

                    {/* Stats */}
                    <div className="grid grid-cols-3 gap-2 mb-4">
                      <div className="text-center bg-blue-50 rounded-lg px-2 py-2">
                        <p className="text-xs font-bold text-blue-700">{formatRM(g.totalRev)}</p>
                        <p className="text-[10px] text-blue-500 mt-0.5">Revenue</p>
                      </div>
                      <div className={`text-center rounded-lg px-2 py-2 ${g.totalNet >= 0 ? 'bg-green-50' : 'bg-red-50'}`}>
                        <p className={`text-xs font-bold ${g.totalNet >= 0 ? 'text-green-700' : 'text-red-700'}`}>{formatRM(g.totalNet)}</p>
                        <p className={`text-[10px] mt-0.5 ${g.totalNet >= 0 ? 'text-green-500' : 'text-red-500'}`}>Net Profit</p>
                      </div>
                      <div className={`text-center rounded-lg px-2 py-2 ${g.avgScore >= 65 ? 'bg-green-50' : g.avgScore >= 50 ? 'bg-amber-50' : 'bg-red-50'}`}>
                        <p className={`text-xs font-bold ${g.avgScore >= 65 ? 'text-green-700' : g.avgScore >= 50 ? 'text-amber-700' : 'text-red-700'}`}>{g.avgScore.toFixed(1)}%</p>
                        <p className={`text-[10px] mt-0.5 ${g.avgScore >= 65 ? 'text-green-500' : g.avgScore >= 50 ? 'text-amber-500' : 'text-red-500'}`}>Avg Score</p>
                      </div>
                    </div>

                    {/* Progress bar */}
                    {g.project && (
                      <div className="mb-4">
                        <div className="flex items-center justify-between text-xs text-slate-500 mb-1">
                          <span>Business Progress</span>
                          <span className="font-semibold">{g.project.businessProgress}%</span>
                        </div>
                        <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                          <div className="h-full bg-teal-500 rounded-full transition-all"
                            style={{ width: `${g.project.businessProgress}%` }} />
                        </div>
                      </div>
                    )}

                    <button onClick={() => setGroupModal(g)}
                      className="w-full text-sm font-medium bg-[#1e3a5f] hover:bg-[#16304f] text-white rounded-lg py-2 transition-colors">
                      View Details
                    </button>
                  </div>
                );
              })}
            </div>
          )}

          {/* ── MODALS ──────────────────────────────────────────────── */}
          {viewModal && (
            <StudentProfileModal
              student={viewModal}
              onClose={() => setViewModal(null)}
            />
          )}

          {editModal && role === 'lecturer' && (
            <StudentEditModal
              student={editModal}
              onClose={() => setEditModal(null)}
              onSave={handleEditSave}
              onDelete={() => handleDelete(editModal.id)}
            />
          )}

          {addModal && role === 'lecturer' && (
            <AddStudentModal
              students={students}
              onClose={() => setAddModal(false)}
              onSave={handleAddSave}
            />
          )}

          {groupModal && (
            <GroupDetailModal
              group={groupModal}
              onClose={() => setGroupModal(null)}
            />
          )}
        </div>
      );
    }
    /* =====================================================================
     *  PLATFORM chip styles
     * ===================================================================== */
    const PLATFORM_STYLES = {
      'TikTok':             'bg-pink-100 text-pink-700 border border-pink-200',
      'Instagram':          'bg-purple-100 text-purple-700 border border-purple-200',
      'Facebook':           'bg-blue-100 text-blue-700 border border-blue-200',
      'Shopee':             'bg-orange-100 text-orange-700 border border-orange-200',
      'WhatsApp':           'bg-green-100 text-green-700 border border-green-200',
      'WhatsApp Business':  'bg-green-100 text-green-700 border border-green-200',
      'Lazada':             'bg-indigo-100 text-indigo-700 border border-indigo-200',
      'Business Website':   'bg-slate-100 text-slate-700 border border-slate-200',
    };

    function PlatformChip({ platform }) {
      const cls = PLATFORM_STYLES[platform] || 'bg-slate-100 text-slate-700 border border-slate-200';
      return (
        <span className={`inline-block text-[10px] font-semibold px-2 py-0.5 rounded-full ${cls}`}>
          {platform}
        </span>
      );
    }

    function StatusBadge({ status }) {
      const cls = {
        'Not Started': 'bg-slate-100 text-slate-600',
        'Planning':    'bg-amber-100 text-amber-700',
        'Active':      'bg-teal-100 text-teal-700',
        'Completed':   'bg-green-100 text-green-700',
      }[status] || 'bg-slate-100 text-slate-600';
      return (
        <span className={`inline-block text-xs font-semibold px-2.5 py-0.5 rounded-full ${cls}`}>
          {status}
        </span>
      );
    }

    function ProgressBar({ value }) {
      const pct = Math.max(0, Math.min(100, value || 0));
      const colour = pct >= 75 ? 'bg-green-500' : pct >= 40 ? 'bg-teal-500' : 'bg-amber-400';
      return (
        <div>
          <div className="flex justify-between text-xs text-slate-500 mb-1">
            <span>Progress</span>
            <span className="font-semibold text-slate-700">{pct}%</span>
          </div>
          <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
            <div className={`h-full rounded-full transition-all ${colour}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    /* =====================================================================
     *  ProjectDetailModal — full project info + mini bar chart
     * ===================================================================== */
    function ProjectDetailModal({ project, totals, onClose, onEdit, canEdit }) {
      const groups     = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_groups'))     || []; } catch { return []; } }, []);
      const allStudents= React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_students'))   || []; } catch { return []; } }, []);
      const weeklyData = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_weeklyData')) || []; } catch { return []; } }, []);

      const group   = groups.find(g => g.id === project.groupId);
      const members = group ? group.memberIds.map(id => allStudents.find(s => s.id === id)).filter(Boolean) : [];
      const groupWD = weeklyData.filter(r => r.groupId === project.groupId).sort((a, b) => a.weekNo - b.weekNo);

      const { totalSales, netProfit } = totals;
      const margin = totalSales > 0 ? ((netProfit / totalSales) * 100).toFixed(1) + '%' : 'N/A';

      // Chart
      const chartRef = React.useRef(null);
      const chartIns = React.useRef(null);

      React.useEffect(() => {
        if (!chartRef.current || typeof Chart === 'undefined') return;
        if (chartIns.current) { chartIns.current.destroy(); chartIns.current = null; }
        chartIns.current = new Chart(chartRef.current, {
          type: 'bar',
          data: {
            labels: groupWD.map(r => 'Wk ' + r.weekNo),
            datasets: [
              {
                label: 'Revenue',
                data: groupWD.map(r => r.revenue),
                backgroundColor: 'rgba(59,130,246,0.75)',
                borderRadius: 3,
              },
              {
                label: 'Net Profit',
                data: groupWD.map(r => r.netProfit),
                backgroundColor: 'rgba(34,197,94,0.75)',
                borderRadius: 3,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } },
              tooltip: { callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + formatRM(ctx.parsed.y) } },
            },
            scales: {
              x: { ticks: { font: { size: 9 } }, grid: { display: false } },
              y: { ticks: { callback: v => 'RM ' + v.toLocaleString('en-MY'), font: { size: 9 } }, grid: { color: '#f1f5f9' } },
            },
          },
        });
        return () => { if (chartIns.current) { chartIns.current.destroy(); chartIns.current = null; } };
      }, [groupWD]);

      return (
        <div className="fixed inset-0 z-50 flex items-start justify-center p-4 overflow-y-auto">
          <div className="absolute inset-0 bg-black/50" onClick={onClose} />
          <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-4xl my-6 z-10 flex flex-col">
            {/* Header */}
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-200 flex-shrink-0">
              <div>
                <h3 className="font-bold text-slate-800 text-lg">{project.name}</h3>
                <p className="text-xs text-slate-500 mt-0.5">{project.id} · {project.groupId} · {project.category}</p>
              </div>
              <div className="flex items-center gap-3 flex-shrink-0">
                <StatusBadge status={project.status} />
                {canEdit && (
                  <button onClick={onEdit}
                    className="flex items-center gap-1.5 text-xs bg-[#1e3a5f] text-white px-3 py-1.5 rounded-lg hover:bg-[#16304f] transition-colors">
                    ✏️ Edit
                  </button>
                )}
                <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition-colors">
                  <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>
            </div>

            {/* Body */}
            <div className="overflow-y-auto flex-1 p-6">
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

                {/* LEFT — Business Info */}
                <div className="space-y-4">
                  <h4 className="font-semibold text-slate-700 text-sm uppercase tracking-wide">Business Information</h4>

                  {[
                    ['Business Name',    project.name],
                    ['Category',         project.category],
                    ['Group',            project.groupId],
                    ['Product / Service',project.product],
                    ['Target Customers', project.targetCustomers],
                    ['Objectives',       project.objectives],
                  ].map(([k, v]) => (
                    <div key={k} className="bg-slate-50 rounded-lg p-3">
                      <p className="text-xs text-slate-500 font-medium mb-0.5">{k}</p>
                      <p className="text-sm font-semibold text-slate-800">{v}</p>
                    </div>
                  ))}

                  {/* Group members */}
                  <div className="bg-slate-50 rounded-lg p-3">
                    <p className="text-xs text-slate-500 font-medium mb-1.5">Group Members</p>
                    <div className="space-y-1">
                      {members.map(m => (
                        <div key={m.id} className="flex justify-between text-xs">
                          <span className="font-medium text-slate-700">{m.name}</span>
                          <span className="text-slate-400">{m.id}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* RIGHT — Performance */}
                <div className="space-y-4">
                  <h4 className="font-semibold text-slate-700 text-sm uppercase tracking-wide">Performance & Status</h4>

                  {/* Platforms */}
                  <div className="bg-slate-50 rounded-lg p-3">
                    <p className="text-xs text-slate-500 font-medium mb-2">Digital Platforms</p>
                    <div className="flex flex-wrap gap-1.5">
                      {(project.platforms || []).map(p => <PlatformChip key={p} platform={p} />)}
                    </div>
                  </div>

                  {/* Progress */}
                  <div className="bg-slate-50 rounded-lg p-3">
                    <ProgressBar value={project.businessProgress} />
                  </div>

                  {/* Status */}
                  <div className="bg-slate-50 rounded-lg p-3">
                    <p className="text-xs text-slate-500 font-medium mb-1">Status</p>
                    <StatusBadge status={project.status} />
                  </div>

                  {/* Financial totals */}
                  <div className="grid grid-cols-3 gap-3">
                    <div className="bg-blue-50 rounded-lg p-3 text-center">
                      <p className="text-xs text-blue-500 font-medium mb-1">Total Sales</p>
                      <p className="text-sm font-bold text-blue-700">{formatRM(totalSales)}</p>
                    </div>
                    <div className={`rounded-lg p-3 text-center ${netProfit >= 0 ? 'bg-green-50' : 'bg-red-50'}`}>
                      <p className={`text-xs font-medium mb-1 ${netProfit >= 0 ? 'text-green-500' : 'text-red-500'}`}>Net Profit</p>
                      <p className={`text-sm font-bold ${netProfit >= 0 ? 'text-green-700' : 'text-red-700'}`}>{formatRM(netProfit)}</p>
                    </div>
                    <div className="bg-purple-50 rounded-lg p-3 text-center">
                      <p className="text-xs text-purple-500 font-medium mb-1">Margin</p>
                      <p className="text-sm font-bold text-purple-700">{margin}</p>
                    </div>
                  </div>

                  {/* Mini bar chart */}
                  <div>
                    <p className="text-xs font-semibold text-slate-600 mb-2">Weekly Revenue — {project.groupId}</p>
                    <div className="bg-white border border-slate-200 rounded-xl p-3" style={{ height: '180px', position: 'relative' }}>
                      <canvas ref={chartRef}></canvas>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* =====================================================================
     *  ProjectEditModal
     * ===================================================================== */
    const ALL_PLATFORMS = ['TikTok', 'Instagram', 'Facebook', 'Shopee', 'WhatsApp Business', 'Business Website'];
    const ALL_STATUSES  = ['Not Started', 'Planning', 'Active', 'Completed'];
    const ALL_CATEGORIES = [
      'Fashion & Apparel', 'Food & Beverage', 'Beauty & Skincare',
      'Technology & Accessories', 'Eco-Friendly Products', 'Print & Design',
