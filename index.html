    /* =====================================================================
     *  ProjectsPage — full implementation
     * ===================================================================== */
    function ProjectsPage() {
      const { role, currentUser } = useApp();

      const [projects, setProjects] = useLocalStorage('dep_projects', []);
      const weeklyData = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_weeklyData')) || []; } catch { return []; } }, []);
      const groups     = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_groups'))     || []; } catch { return []; } }, []);
      const students   = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_students'))   || []; } catch { return []; } }, []);

      // ── View state ────────────────────────────────────────────────────
      const [view,           setView]           = React.useState('cards');  // 'cards' | 'table'
      const [statusFilter,   setStatusFilter]   = React.useState('All');
      const [categoryFilter, setCategoryFilter] = React.useState('All');

      // ── Modal state ───────────────────────────────────────────────────
      const [detailModal, setDetailModal] = React.useState(null);  // project object
      const [editModal,   setEditModal]   = React.useState(null);  // project object
      const [addModal,    setAddModal]    = React.useState(false);

      // ── Computed totals from weeklyData per project (via groupId) ─────
      const totalsMap = React.useMemo(() => {
        const map = {};
        weeklyData.forEach(r => {
          if (!map[r.groupId]) map[r.groupId] = { totalSales: 0, netProfit: 0 };
          map[r.groupId].totalSales += r.revenue  || 0;
          map[r.groupId].netProfit  += r.netProfit || 0;
        });
        return map;
      }, [weeklyData]);

      const getTotals = (project) => {
        const t = totalsMap[project.groupId] || { totalSales: 0, netProfit: 0 };
        return {
          totalSales: Math.round(t.totalSales * 100) / 100,
          netProfit:  Math.round(t.netProfit  * 100) / 100,
        };
      };

      // ── Role: can a user edit a given project? ────────────────────────
      const canEdit = (project) => {
        if (role === 'lecturer') return true;
        if (role === 'student') {
          // Find which group the current user belongs to
          const stu = students.find(s => s.id === currentUser?.id);
          return stu ? stu.groupId === project.groupId : false;
        }
        return false;
      };

      // ── Category options ──────────────────────────────────────────────
      const categories = React.useMemo(() => {
        const cats = [...new Set(projects.map(p => p.category))].sort();
        return cats;
      }, [projects]);

      // ── Filtered list ─────────────────────────────────────────────────
      const filtered = React.useMemo(() => {
        return projects.filter(p => {
          if (statusFilter   !== 'All' && p.status   !== statusFilter)   return false;
          if (categoryFilter !== 'All' && p.category !== categoryFilter) return false;
          return true;
        });
      }, [projects, statusFilter, categoryFilter]);

      // ── CRUD handlers ─────────────────────────────────────────────────
      const handleEditSave = (updated) => {
        setProjects(prev => prev.map(p => p.id === updated.id ? updated : p));
        setEditModal(null);
        // If detail was open, refresh it too
        if (detailModal && detailModal.id === updated.id) setDetailModal(updated);
      };

      const handleAddSave = (newProj) => {
        setProjects(prev => [...prev, newProj]);
        setAddModal(false);
      };

      // ── Render helpers ────────────────────────────────────────────────
      const openDetail = (p) => setDetailModal(p);
      const openEdit   = (p) => { setEditModal(p); setDetailModal(null); };

      return (
        <div className="space-y-5">
          {/* DEMO banner */}
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 text-xs text-amber-700 font-medium text-center">
            ⚠ DEMO DATA — For Teaching and Demonstration Purposes Only
          </div>

          {/* Header toolbar */}
          <div className="flex flex-wrap items-center gap-3">
            {/* Title */}
            <div className="mr-auto">
              <h2 className="text-base font-bold text-slate-800">Business Projects</h2>
              <p className="text-xs text-slate-500">{filtered.length} of {projects.length} projects</p>
            </div>

            {/* View toggle */}
            <div className="flex gap-1 bg-white rounded-lg p-1 border border-slate-200 shadow-sm">
              {[
                { id: 'cards', label: '⊞ Cards' },
                { id: 'table', label: '☰ Table' },
              ].map(v => (
                <button key={v.id} onClick={() => setView(v.id)}
                  className={`px-4 py-1.5 text-xs font-semibold rounded-md transition-colors
                    ${view === v.id ? 'bg-[#1e3a5f] text-white' : 'text-slate-600 hover:bg-slate-100'}`}>
                  {v.label}
                </button>
              ))}
            </div>

            {/* Status filter */}
            <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}
              className="text-sm border border-slate-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
              <option value="All">All Status</option>
              {ALL_STATUSES.map(s => <option key={s}>{s}</option>)}
            </select>

            {/* Category filter */}
            <select value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)}
              className="text-sm border border-slate-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
              <option value="All">All Categories</option>
              {categories.map(c => <option key={c}>{c}</option>)}
            </select>

            {/* Reset */}
            {(statusFilter !== 'All' || categoryFilter !== 'All') && (
              <button onClick={() => { setStatusFilter('All'); setCategoryFilter('All'); }}
                className="text-xs text-blue-600 hover:text-blue-800 font-medium underline">
                Reset
              </button>
            )}

            {/* Add Project (Lecturer only) */}
            {role === 'lecturer' && (
              <button onClick={() => setAddModal(true)}
                className="flex items-center gap-1.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors flex-shrink-0">
                + Add Project
              </button>
            )}
          </div>

          {/* ── CARDS VIEW ──────────────────────────────────────────────── */}
          {view === 'cards' && (
            <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
              {filtered.length === 0 && (
                <div className="col-span-3 text-center py-16 text-slate-400">
                  No projects match the selected filters.
                </div>
              )}
              {filtered.map(project => {
                const { totalSales, netProfit } = getTotals(project);
                const margin = totalSales > 0 ? ((netProfit / totalSales) * 100).toFixed(1) + '%' : 'N/A';
                return (
                  <div key={project.id} className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col hover:shadow-md transition-shadow">
                    {/* Card header */}
                    <div className="px-5 pt-5 pb-3 border-b border-slate-100 flex items-start justify-between">
                      <div className="flex-1 min-w-0 pr-2">
                        <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-0.5">{project.id} · {project.groupId}</p>
                        <h3 className="font-bold text-slate-800 text-base leading-tight truncate">{project.name}</h3>
                        <p className="text-xs text-slate-500 mt-0.5">{project.category}</p>
                      </div>
                      <StatusBadge status={project.status} />
                    </div>

                    {/* Card body */}
                    <div className="px-5 py-4 flex-1 space-y-3">
                      {/* Platforms */}
                      <div className="flex flex-wrap gap-1">
                        {(project.platforms || []).map(p => <PlatformChip key={p} platform={p} />)}
                      </div>

                      {/* Progress bar */}
                      <ProgressBar value={project.businessProgress} />

                      {/* Stats row */}
                      <div className="grid grid-cols-2 gap-2">
                        <div className="bg-blue-50 rounded-lg px-3 py-2">
                          <p className="text-[10px] text-blue-500 font-medium">Total Sales</p>
                          <p className="text-xs font-bold text-blue-700 mt-0.5">{formatRM(totalSales)}</p>
                        </div>
                        <div className={`rounded-lg px-3 py-2 ${netProfit >= 0 ? 'bg-green-50' : 'bg-red-50'}`}>
                          <p className={`text-[10px] font-medium ${netProfit >= 0 ? 'text-green-500' : 'text-red-500'}`}>Net Profit</p>
                          <p className={`text-xs font-bold mt-0.5 ${netProfit >= 0 ? 'text-green-700' : 'text-red-700'}`}>{formatRM(netProfit)}</p>
                        </div>
                      </div>
                    </div>

                    {/* Card footer */}
                    <div className="px-5 py-3 border-t border-slate-100 flex gap-2">
                      <button onClick={() => openDetail(project)}
                        className="flex-1 text-xs font-semibold bg-[#1e3a5f] hover:bg-[#16304f] text-white rounded-lg py-2 transition-colors">
                        View Details
                      </button>
                      {canEdit(project) && (
                        <button onClick={() => openEdit(project)}
                          className="flex-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg py-2 transition-colors">
                          Edit
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* ── TABLE VIEW ──────────────────────────────────────────────── */}
          {view === 'table' && (
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead className="bg-slate-50 border-b border-slate-200">
                    <tr>
                      {['Project ID', 'Business Name', 'Category', 'Group', 'Status', 'Progress', 'Total Sales', 'Net Profit', 'Actions'].map(h => (
                        <th key={h} className="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">
                          {h}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.length === 0 && (
                      <tr>
                        <td colSpan={9} className="px-4 py-10 text-center text-slate-400">No projects match the selected filters.</td>
                      </tr>
                    )}
                    {filtered.map(project => {
                      const { totalSales, netProfit } = getTotals(project);
                      return (

                            {formatRM(netProfit)}

                          <td className="px-4 py-3">
                            <div className="flex items-center gap-2">
                              <button onClick={() => openDetail(project)}
                                className="text-xs bg-[#1e3a5f] text-white px-3 py-1.5 rounded-lg hover:bg-[#16304f] transition-colors whitespace-nowrap">
                                View
                              </button>
                              {canEdit(project) && (
                                <button onClick={() => openEdit(project)}
                                  className="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-200 transition-colors">
                                  Edit
                                </button>

                      );
                    })}

              </div>

          )}

          {/* ── MODALS ──────────────────────────────────────────────────── */}
          {detailModal && (
            <ProjectDetailModal
              project={detailModal}
              totals={getTotals(detailModal)}
              onClose={() => setDetailModal(null)}

            />
          )}

          {editModal && canEdit(editModal) && (
            <ProjectEditModal
              project={editModal}
              onClose={() => setEditModal(null)}

            />
          )}

          {addModal && role === 'lecturer' && (
            <AddProjectModal
              projects={projects}
              onClose={() => setAddModal(false)}

            />
          )}
        </div>
      );
    }
    /* =====================================================================
     *  SalesAnalyticsPage — Page 4: Sales & Profit Analytics
     * ===================================================================== */
    function SalesAnalyticsPage() {
      const { role, currentUser } = useApp();

      // ── Load data ────────────────────────────────────────────────────────
      const [weeklyData, setWeeklyData] = useLocalStorage('dep_weeklyData', []);
      const groups   = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_groups'))   || []; } catch { return []; } }, []);
      const projects = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_projects')) || []; } catch { return []; } }, []);

      // ── Filter state ──────────────────────────────────────────────────────
      const [weekFrom,       setWeekFrom]       = React.useState(1);
      const [weekTo,         setWeekTo]         = React.useState(14);
      const [selectedGroup,  setSelectedGroup]  = React.useState('All');
      const [selectedProject,setSelectedProject]= React.useState('All');
      const [viewMode,       setViewMode]       = React.useState('weekly'); // 'weekly' | 'cumulative'

      // ── Chart toggles for Chart 1 ─────────────────────────────────────────
      const [showRev, setShowRev] = React.useState(true);
      const [showExp, setShowExp] = React.useState(true);
      const [showNet, setShowNet] = React.useState(true);

      // ── Modal state ────────────────────────────────────────────────────────
      const [addModal,  setAddModal]  = React.useState(false);
      const [editModal, setEditModal] = React.useState(null); // { record }

      // ── Sync project ↔ group ──────────────────────────────────────────────
      const handleGroupChange = (gid) => {
        setSelectedGroup(gid);
        setSelectedProject('All');
      };
      const handleProjectChange = (pid) => {
        setSelectedProject(pid);
        if (pid === 'All') { setSelectedGroup('All'); return; }
        const proj = projects.find(p => p.id === pid);
        if (proj) setSelectedGroup(proj.groupId);
      };
      const resetFilters = () => {
        setWeekFrom(1); setWeekTo(14);
        setSelectedGroup('All'); setSelectedProject('All');
        setViewMode('weekly');
      };

      // ── Derive available group/project options (restricted for students) ──
      const availableGroups = React.useMemo(() => {
        if (role === 'student') return groups.filter(g => g.id === currentUser?.groupId);
        return groups;
      }, [groups, role, currentUser]);

      const availableProjects = React.useMemo(() => {
        if (selectedGroup !== 'All') {
          return projects.filter(p => p.groupId === selectedGroup);
        }
        if (role === 'student') return projects.filter(p => p.groupId === currentUser?.groupId);
        return projects;
      }, [projects, selectedGroup, role, currentUser]);

      // ── Filtered weekly data ──────────────────────────────────────────────
      const filteredData = React.useMemo(() => {
        return weeklyData.filter(r => {
          if (r.weekNo < weekFrom || r.weekNo > weekTo) return false;
          if (selectedGroup !== 'All' && r.groupId !== selectedGroup) return false;
          if (selectedProject !== 'All') {
            const proj = projects.find(p => p.id === selectedProject);
            if (proj && r.groupId !== proj.groupId) return false;
          }
          if (role === 'student' && r.groupId !== currentUser?.groupId) return false;
          return true;
        });
      }, [weeklyData, weekFrom, weekTo, selectedGroup, selectedProject, role, currentUser, projects]);

      // ── KPI computations ──────────────────────────────────────────────────
      const totalRevenue  = filteredData.reduce((s, r) => s + (r.revenue  || 0), 0);
      const totalExpenses = filteredData.reduce((s, r) => s + (r.expenses || 0), 0);
      const netProfit     = totalRevenue - totalExpenses;
      const profitMargin  = totalRevenue > 0 ? ((netProfit / totalRevenue) * 100) : null;

      // Weekly Sales Growth: last week vs second-to-last week (per the filtered range)
      const weeklyGrowth = React.useMemo(() => {
        const weeks = [];
        for (let w = weekFrom; w <= weekTo; w++) weeks.push(w);
        if (weeks.length < 2) return null;
        const lastW = weeks[weeks.length - 1];
        const prevW = weeks[weeks.length - 2];
        const sumRev = (wNo) => filteredData
          .filter(r => r.weekNo === wNo)
          .reduce((s, r) => s + (r.revenue || 0), 0);
        const lastRev = sumRev(lastW);
        const prevRev = sumRev(prevW);
        if (prevRev === 0) return null;
        return ((lastRev - prevRev) / prevRev) * 100;
      }, [filteredData, weekFrom, weekTo]);

      // ── Weeks in range ────────────────────────────────────────────────────
      const weeksInRange = React.useMemo(() => {
        const arr = [];
        for (let w = weekFrom; w <= weekTo; w++) arr.push(w);
        return arr;
      }, [weekFrom, weekTo]);

      // ── Aggregated series per week (for charts 1 & 2) ────────────────────
      const weeklyAggregated = React.useMemo(() => {
        return weeksInRange.map(w => {
          const rows = filteredData.filter(r => r.weekNo === w);
          const rev = rows.reduce((s, r) => s + (r.revenue  || 0), 0);
          const exp = rows.reduce((s, r) => s + (r.expenses || 0), 0);
          return { week: w, revenue: rev, expenses: exp, netProfit: rev - exp };
        });
      }, [filteredData, weeksInRange]);

      // ── Cumulative helper ─────────────────────────────────────────────────
      const toCumulative = (arr) => {
        let cumRev = 0, cumExp = 0, cumNet = 0;
        return arr.map(d => {
          cumRev += d.revenue; cumExp += d.expenses; cumNet += d.netProfit;
          return { week: d.week, revenue: cumRev, expenses: cumExp, netProfit: cumNet };
        });
      };

      const displaySeries = viewMode === 'cumulative' ? toCumulative(weeklyAggregated) : weeklyAggregated;

      // ── Per-group totals for charts 3 & 4 ────────────────────────────────
      const groupTotals = React.useMemo(() => {
        return groups.map(g => {
          const rows = filteredData.filter(r => r.groupId === g.id);
          const rev  = rows.reduce((s, r) => s + (r.revenue  || 0), 0);
          const exp  = rows.reduce((s, r) => s + (r.expenses || 0), 0);
          const np   = rev - exp;
          const margin = rev > 0 ? (np / rev) * 100 : null;
          const proj = projects.find(p => p.groupId === g.id);
          // sparkline: weekly revenue for this group in range
          const spark = weeksInRange.map(w => {
            const r = weeklyData.find(d => d.groupId === g.id && d.weekNo === w);
            return r ? r.revenue : 0;
          });
          return { groupId: g.id, projectName: proj?.name || g.id, revenue: rev, expenses: exp, netProfit: np, margin, spark };
        });
      }, [filteredData, groups, projects, weeksInRange, weeklyData]);

      // Sorted for "Best Performing Groups" table
      const rankedGroups = React.useMemo(() => {
        return [...groupTotals].sort((a, b) => b.netProfit - a.netProfit);
      }, [groupTotals]);

      // ── Transaction log ───────────────────────────────────────────────────
      const txRows = React.useMemo(() => {
        return filteredData.map(r => {
          // growth vs previous week for same group
          const prevWeekRec = weeklyData.find(d => d.groupId === r.groupId && d.weekNo === r.weekNo - 1);
          const growth = (prevWeekRec && prevWeekRec.revenue > 0)
            ? ((r.revenue - prevWeekRec.revenue) / prevWeekRec.revenue) * 100
            : null;
          const proj = projects.find(p => p.groupId === r.groupId);
          return { ...r, projectName: proj?.name || r.groupId, growth };
        }).sort((a, b) => a.weekNo - b.weekNo || a.groupId.localeCompare(b.groupId));
      }, [filteredData, weeklyData, projects]);

      // ── Chart refs ────────────────────────────────────────────────────────
      const chart1Ref = React.useRef(null); const chart1Inst = React.useRef(null);
      const chart2Ref = React.useRef(null); const chart2Inst = React.useRef(null);
      const chart3Ref = React.useRef(null); const chart3Inst = React.useRef(null);

      const weekLabels = displaySeries.map(d => 'Wk ' + d.week);

      // Chart 1 — Weekly Sales Trend (Line)
      React.useEffect(() => {
        if (!chart1Ref.current || typeof Chart === 'undefined') return;
        if (chart1Inst.current) { chart1Inst.current.destroy(); chart1Inst.current = null; }
        const datasets = [];
        if (showRev) datasets.push({ label: 'Revenue',    data: displaySeries.map(d => d.revenue),   borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.08)',  tension: 0.3, fill: false, pointRadius: 4 });
        if (showExp) datasets.push({ label: 'Expenses',   data: displaySeries.map(d => d.expenses),  borderColor: '#f97316', backgroundColor: 'rgba(249,115,22,0.08)',  tension: 0.3, fill: false, pointRadius: 4 });
        if (showNet) datasets.push({ label: 'Net Profit', data: displaySeries.map(d => d.netProfit), borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.08)',   tension: 0.3, fill: false, pointRadius: 4 });
        chart1Inst.current = new Chart(chart1Ref.current, {
          type: 'line',
          data: { labels: weekLabels, datasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + formatRM(ctx.parsed.y) } },
            },
            scales: {
              x: { grid: { color: '#f1f5f9' } },
              y: { grid: { color: '#f1f5f9' }, ticks: { callback: v => 'RM ' + v.toLocaleString('en-MY') } },
            },
          },
        });
        return () => { if (chart1Inst.current) { chart1Inst.current.destroy(); chart1Inst.current = null; } };
      }, [displaySeries, showRev, showExp, showNet]);

      // Chart 2 — Revenue vs Expenses grouped Bar
      React.useEffect(() => {
        if (!chart2Ref.current || typeof Chart === 'undefined') return;
        if (chart2Inst.current) { chart2Inst.current.destroy(); chart2Inst.current = null; }
        chart2Inst.current = new Chart(chart2Ref.current, {
          type: 'bar',
          data: {
            labels: weekLabels,
            datasets: [
              { label: 'Revenue',  data: displaySeries.map(d => d.revenue),  backgroundColor: 'rgba(59,130,246,0.7)', borderRadius: 3 },
              { label: 'Expenses', data: displaySeries.map(d => d.expenses), backgroundColor: 'rgba(249,115,22,0.7)', borderRadius: 3 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
              tooltip: { callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + formatRM(ctx.parsed.y) } },
            },
            scales: {
              x: { grid: { display: false } },
              y: { grid: { color: '#f1f5f9' }, ticks: { callback: v => 'RM ' + v.toLocaleString('en-MY') } },
            },
          },
        });
        return () => { if (chart2Inst.current) { chart2Inst.current.destroy(); chart2Inst.current = null; } };
      }, [displaySeries]);

      // Chart 3 — Profit by Business Group Bar
      React.useEffect(() => {
        if (!chart3Ref.current || typeof Chart === 'undefined') return;
        if (chart3Inst.current) { chart3Inst.current.destroy(); chart3Inst.current = null; }
        const labels = groupTotals.map(g => g.projectName);
        const data   = groupTotals.map(g => g.netProfit);
        const bgColours = data.map(v => v >= 0 ? 'rgba(34,197,94,0.7)' : 'rgba(239,68,68,0.7)');
        chart3Inst.current = new Chart(chart3Ref.current, {
          type: 'bar',
          data: {
            labels,
            datasets: [{ label: 'Net Profit', data, backgroundColor: bgColours, borderRadius: 4 }],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: ctx => ' Net Profit: ' + formatRM(ctx.parsed.y) } },
            },
            scales: {
              x: { grid: { display: false }, ticks: { font: { size: 10 } } },
              y: { grid: { color: '#f1f5f9' }, ticks: { callback: v => 'RM ' + v.toLocaleString('en-MY') } },
            },
          },
        });
        return () => { if (chart3Inst.current) { chart3Inst.current.destroy(); chart3Inst.current = null; } };
      }, [groupTotals]);

      // ── Save handler from modals ──────────────────────────────────────────
      const handleSave = (updated) => {
        setWeeklyData(prev => {
          const idx = prev.findIndex(r => r.groupId === updated.groupId && r.weekNo === updated.weekNo);
          if (idx === -1) return [...prev, updated];
          const next = [...prev];
          next[idx] = updated;
          return next;
        });
        setEditModal(null);
        setAddModal(false);
      };

      // ── Sparkline SVG ─────────────────────────────────────────────────────
      const Sparkline = ({ data }) => {
        if (!data || data.length < 2) return <span className="text-xs text-slate-400">—</span>;
        const max = Math.max(...data, 1);
        const min = Math.min(...data, 0);
        const range = max - min || 1;
        const W = 60, H = 22;
        const pts = data.map((v, i) => {
          const x = (i / (data.length - 1)) * W;
          const y = H - ((v - min) / range) * H;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');
        return (
          <svg width={W} height={H} style={{ display: 'block' }}>
            <polyline points={pts} fill="none" stroke="#3b82f6" strokeWidth="1.5" strokeLinejoin="round" />
          </svg>
        );
      };

      const weekOptions = Array.from({ length: 14 }, (_, i) => i + 1);

      // ── AddTransactionModal ───────────────────────────────────────────────
      function AddTransactionModal({ onClose, onSave }) {
        const isStudent = role === 'student';
        const defaultGroup = isStudent ? (currentUser?.groupId || 'G01') : 'G01';
        const [week,    setWeek]    = React.useState(weekFrom);
        const [groupId, setGroupId] = React.useState(defaultGroup);
        const [revenue, setRevenue] = React.useState('');
        const [expenses,setExpenses]= React.useState('');
        const [errors,  setErrors]  = React.useState({});

        const validate = () => {
          const e = {};
          if (!week) e.week = 'Required';
          if (revenue === '' || isNaN(Number(revenue)) || Number(revenue) < 0) e.revenue = 'Must be ≥ 0';
          if (expenses === '' || isNaN(Number(expenses)) || Number(expenses) < 0) e.expenses = 'Must be ≥ 0';
          setErrors(e);
          return Object.keys(e).length === 0;
        };

        const handleSave = () => {
          if (!validate()) return;
          const rev = parseFloat(revenue);
          const exp = parseFloat(expenses);
          const np  = Math.round((rev - exp) * 100) / 100;
          // compute salesGrowth
          const prevRec = weeklyData.find(r => r.groupId === groupId && r.weekNo === Number(week) - 1);
          const salesGrowth = prevRec && prevRec.revenue > 0 ? Math.round(((rev - prevRec.revenue) / prevRec.revenue) * 10000) / 100 : 0;
          onSave({ weekNo: Number(week), groupId, revenue: Math.round(rev*100)/100, expenses: Math.round(exp*100)/100, netProfit: np, salesGrowth });
        };

        return (
          <ModalShell title="Add Transaction" onClose={onClose}>
            <div className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Week</label>
                <select value={week} onChange={e => setWeek(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                  {weekOptions.map(w => <option key={w} value={w}>Week {w}</option>)}
                </select>
                {errors.week && <p className="text-red-500 text-xs mt-0.5">{errors.week}</p>}
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Group / Project</label>
                <select value={groupId} onChange={e => setGroupId(e.target.value)} disabled={isStudent}
                  className={`w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 ${isStudent ? 'bg-slate-100 cursor-not-allowed' : ''}`}>
                  {(isStudent ? availableGroups : groups).map(g => {
                    const proj = projects.find(p => p.groupId === g.id);
                    return <option key={g.id} value={g.id}>{g.id} — {proj?.name || g.id}</option>;
                  })}
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Revenue (RM)</label>
                <input type="number" min="0" step="0.01" value={revenue} onChange={e => setRevenue(e.target.value)}
                  placeholder="0.00" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                {errors.revenue && <p className="text-red-500 text-xs mt-0.5">{errors.revenue}</p>}
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Expenses (RM)</label>
                <input type="number" min="0" step="0.01" value={expenses} onChange={e => setExpenses(e.target.value)}
                  placeholder="0.00" className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                {errors.expenses && <p className="text-red-500 text-xs mt-0.5">{errors.expenses}</p>}
              </div>
              <div className="flex justify-end gap-2 pt-2">
                <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Cancel</button>
                <button onClick={handleSave} className="px-4 py-2 text-sm bg-[#1e3a5f] text-white rounded-lg hover:bg-[#16304f] transition-colors font-medium">Save</button>
              </div>
            </div>
          </ModalShell>
        );
      }

      // ── EditTransactionModal ──────────────────────────────────────────────
      function EditTransactionModal({ record, onClose, onSave }) {
        const [revenue, setRevenue]  = React.useState(String(record.revenue));
        const [expenses,setExpenses] = React.useState(String(record.expenses));
        const [errors,  setErrors]   = React.useState({});
        const proj = projects.find(p => p.groupId === record.groupId);

        const validate = () => {
          const e = {};
          if (revenue === '' || isNaN(Number(revenue)) || Number(revenue) < 0) e.revenue = 'Must be ≥ 0';
          if (expenses === '' || isNaN(Number(expenses)) || Number(expenses) < 0) e.expenses = 'Must be ≥ 0';
          setErrors(e);
          return Object.keys(e).length === 0;
        };

        const handleSave = () => {
          if (!validate()) return;
          const rev = Math.round(parseFloat(revenue) * 100) / 100;
          const exp = Math.round(parseFloat(expenses) * 100) / 100;
          const np  = Math.round((rev - exp) * 100) / 100;
          const prevRec = weeklyData.find(r => r.groupId === record.groupId && r.weekNo === record.weekNo - 1);
          const salesGrowth = prevRec && prevRec.revenue > 0 ? Math.round(((rev - prevRec.revenue) / prevRec.revenue) * 10000) / 100 : 0;
          onSave({ ...record, revenue: rev, expenses: exp, netProfit: np, salesGrowth });
        };

        return (
          <ModalShell title={`Edit Transaction — Week ${record.weekNo} · ${record.groupId}`} onClose={onClose}>
            <div className="space-y-4">
              <div className="grid grid-cols-2 gap-3 bg-slate-50 rounded-lg p-3 text-sm">
                <div><span className="text-slate-500 text-xs">Week</span><p className="font-semibold text-slate-800">Week {record.weekNo}</p></div>
                <div><span className="text-slate-500 text-xs">Group / Project</span><p className="font-semibold text-slate-800">{record.groupId} — {proj?.name || record.groupId}</p></div>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Revenue (RM)</label>
                <input type="number" min="0" step="0.01" value={revenue} onChange={e => setRevenue(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                {errors.revenue && <p className="text-red-500 text-xs mt-0.5">{errors.revenue}</p>}
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Expenses (RM)</label>
                <input type="number" min="0" step="0.01" value={expenses} onChange={e => setExpenses(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
                {errors.expenses && <p className="text-red-500 text-xs mt-0.5">{errors.expenses}</p>}
              </div>
              <div className="flex justify-end gap-2 pt-2">
                <button onClick={onClose} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Cancel</button>
                <button onClick={handleSave} className="px-4 py-2 text-sm bg-[#1e3a5f] text-white rounded-lg hover:bg-[#16304f] transition-colors font-medium">Save</button>
              </div>
            </div>
          </ModalShell>
        );
      }

      // ── Render ─────────────────────────────────────────────────────────────
      return (

    // ── Helper: format date as "DD Mon YYYY" ────────────────────────────
    function formatDueDate(isoStr) {
      if (!isoStr) return '—';
      const d = new Date(isoStr + 'T00:00:00');
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    // ── Helper: derive display status (overdue is derived, not stored) ───
    function getDisplayStatus(storedStatus, dueDateStr) {
      if (storedStatus === 'Submitted' || storedStatus === 'Completed') return storedStatus;
      const today = new Date().toISOString().slice(0, 10);
      if (dueDateStr && today > dueDateStr) return 'Overdue';
      return storedStatus;
    }

    // ── Weekly status badge ──────────────────────────────────────────────
    function WeekStatusBadge({ status }) {
      const cfg = {
        'Not Started': 'bg-slate-100 text-slate-600',
        'In Progress':  'bg-blue-100 text-blue-700',
        'Submitted':    'bg-teal-100 text-teal-700',
        'Completed':    'bg-green-100 text-green-700',
        'Overdue':      'bg-red-100 text-red-700',
      };
      return (
        <span className={`inline-block text-xs font-semibold px-2.5 py-0.5 rounded-full whitespace-nowrap ${cfg[status] || cfg['Not Started']}`}>
          {status}
        </span>
      );
    }

    // ── WeekEditModal ────────────────────────────────────────────────────
    function WeekEditModal({ week, onClose, onSave }) {
      const [topic,   setTopic]   = React.useState(week.topic);
      const [dueDate, setDueDate] = React.useState(week.dueDate);
      const [tasks,   setTasks]   = React.useState((week.tasks || []).join('\n'));
      const [error,   setError]   = React.useState('');

      const handleSave = () => {
        if (!topic.trim()) { setError('Topic is required'); return; }
        const taskList = tasks.split('\n').map(t => t.trim()).filter(Boolean);
        onSave({ ...week, topic: topic.trim(), dueDate, tasks: taskList });
      };

      return (
        <ModalShell title={`Edit Week ${week.weekNo}`} onClose={onClose}>
          <div className="space-y-4">
            <div>
              <label className="block text-xs font-semibold text-slate-600 mb-1">Topic</label>
              <input
                value={topic}
                onChange={e => { setTopic(e.target.value); setError(''); }}
                className={`w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 ${error ? 'border-red-400' : 'border-slate-300'}`}
              />
              {error && <p className="text-red-500 text-xs mt-0.5">{error}</p>}
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-600 mb-1">Due Date</label>
              <input
                type="date"
                value={dueDate}
                onChange={e => setDueDate(e.target.value)}
                className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
              />
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-600 mb-1">
                Tasks <span className="font-normal text-slate-400">(one per line)</span>
              </label>
              <textarea
                value={tasks}
                onChange={e => setTasks(e.target.value)}
                rows={5}

    // ── WeeklyProgressPage ───────────────────────────────────────────────
    function WeeklyProgressPage() {
      const { role, currentUser } = useApp();
      const today = new Date().toISOString().slice(0, 10);

      // ── Data state ─────────────────────────────────────────────────────
      const [weeklyTopics,      setWeeklyTopics]      = useLocalStorage('dep_weeklyTopics',       []);
      const [studentWeekStatus, setStudentWeekStatus] = useLocalStorage('dep_studentWeeklyStatus', {});
      const students  = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_students'))  || []; } catch { return []; } }, []);
      const groups    = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_groups'))    || []; } catch { return []; } }, []);
      const projects  = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_projects'))  || []; } catch { return []; } }, []);

      // ── Filter state ───────────────────────────────────────────────────
      const [statusFilter,  setStatusFilter]  = React.useState('All');
      const [groupFilter,   setGroupFilter]   = React.useState('All');
      const [searchTopic,   setSearchTopic]   = React.useState('');

      // ── Accordion & modal state ────────────────────────────────────────
      const [expandedWeek,  setExpandedWeek]  = React.useState(null);
      const [editWeekModal, setEditWeekModal] = React.useState(null);  // week object
      const [feedbackModal, setFeedbackModal] = React.useState(null);  // { student, week, existingFeedback }

      // Refs for accordion panels (for scroll-to)
      const panelRefs = React.useRef({});

      // ── Visible students (role-filtered) ──────────────────────────────
      const visibleStudents = React.useMemo(() => {
        if (role === 'student') return students.filter(s => s.id === currentUser?.id);
        if (groupFilter !== 'All') return students.filter(s => s.groupId === groupFilter);
        return students;
      }, [students, role, currentUser, groupFilter]);

      // ── Compute completion % for a given week ─────────────────────────
      const getCompletionPct = React.useCallback((weekNo) => {
        const total = students.length;
        if (!total) return 0;
        const done = students.filter(s => {
          const key = `${s.id}_${weekNo}`;
          const st = (studentWeekStatus[key]?.status) || 'Not Started';
          return st === 'Submitted' || st === 'Completed';
        }).length;
        return Math.round((done / total) * 100);
      }, [students, studentWeekStatus]);

      // ── Overall progress (across all 14 weeks × all students) ─────────
      const overallPct = React.useMemo(() => {
        const total = students.length * weeklyTopics.length;
        if (!total) return 0;
        let done = 0;
        students.forEach(s => {
          weeklyTopics.forEach(w => {
            const key = `${s.id}_${w.weekNo}`;
            const st = (studentWeekStatus[key]?.status) || 'Not Started';
            if (st === 'Submitted' || st === 'Completed') done++;
          });
        });
        return Math.round((done / total) * 100);
      }, [students, weeklyTopics, studentWeekStatus]);

      // ── Get display status (overdue override) ─────────────────────────
      const getStudentDisplayStatus = React.useCallback((studentId, week) => {
        const key = `${studentId}_${week.weekNo}`;
        const stored = (studentWeekStatus[key]?.status) || 'Not Started';
        return getDisplayStatus(stored, week.dueDate);
      }, [studentWeekStatus]);

      // ── Filter weeks by status (aggregate) and search ─────────────────
      const filteredWeeks = React.useMemo(() => {
        return weeklyTopics.filter(w => {
          // search by topic
          if (searchTopic && !w.topic.toLowerCase().includes(searchTopic.toLowerCase())) return false;
          // status filter: check if current student (or any visible student) has that display status
          if (statusFilter !== 'All') {
            const match = visibleStudents.some(s => getStudentDisplayStatus(s.id, w) === statusFilter);
            if (!match) return false;
          }
          return true;
        });
      }, [weeklyTopics, searchTopic, statusFilter, visibleStudents, getStudentDisplayStatus]);

      // ── Save week edit ─────────────────────────────────────────────────
      const handleSaveWeek = (updated) => {
        setWeeklyTopics(prev => prev.map(w => w.weekNo === updated.weekNo ? updated : w));
        setEditWeekModal(null);
      };

      // ── Save feedback ──────────────────────────────────────────────────
      const handleSaveFeedback = (text) => {
        if (!feedbackModal) return;
        const { student, week } = feedbackModal;
        const key = `${student.id}_${week.weekNo}`;
        setStudentWeekStatus(prev => ({
          ...prev,
          [key]: { ...(prev[key] || { status: 'Not Started' }), feedback: text },
        }));
        setFeedbackModal(null);
      };

      // ── Inline status change ──────────────────────────────────────────
      const handleStatusChange = (studentId, weekNo, newStatus) => {
        const key = `${studentId}_${weekNo}`;
        setStudentWeekStatus(prev => ({
          ...prev,
          [key]: { ...(prev[key] || { feedback: '' }), status: newStatus },
        }));
      };

      // ── Toggle accordion ──────────────────────────────────────────────
      const toggleWeek = (weekNo) => {
        setExpandedWeek(prev => prev === weekNo ? null : weekNo);
      };

      // Scroll to a week panel and expand it
      const scrollToWeek = (weekNo) => {
        setExpandedWeek(weekNo);
        setTimeout(() => {
          const el = panelRefs.current[weekNo];
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 50);
      };

      const STATUS_OPTIONS = ['Not Started', 'In Progress', 'Submitted', 'Completed'];

      // ── Render ─────────────────────────────────────────────────────────
      return (
        <div className="space-y-6">
          {/* DEMO banner */}
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 text-xs text-amber-700 font-medium text-center">
            ⚠ DEMO DATA — For Teaching and Demonstration Purposes Only
          </div>

          {/* ── OVERALL PROGRESS BAR ── */}
          <div className="bg-white rounded-xl shadow-sm border border-slate-200 px-5 py-4">
            <div className="flex items-center justify-between mb-2">
              <div>
                <h2 className="font-bold text-slate-800 text-sm">Overall Submission Progress</h2>
                <p className="text-xs text-slate-400 mt-0.5">

              </div>
              <span className="text-2xl font-bold text-[#1e3a5f]">{overallPct}%</span>
            </div>
            <div className="h-3 bg-slate-100 rounded-full overflow-hidden">
              <div
                className={`h-full rounded-full transition-all ${overallPct >= 75 ? 'bg-green-500' : overallPct >= 40 ? 'bg-teal-500' : 'bg-amber-400'}`}
                style={{ width: `${overallPct}%` }}
              />
            </div>
            <div className="flex justify-between text-[10px] text-slate-400 mt-1">
              <span>0%</span>
              <span>50%</span>
              <span>100%</span>
            </div>

              {/* Status filter */}

              {/* Group filter (Lecturer only) */}
              {role === 'lecturer' && (
                <div className="flex items-center gap-2">

                  <select value={groupFilter} onChange={e => setGroupFilter(e.target.value)}

                    <option value="All">All Groups</option>

              {/* Reset */}

              return (
                <div

                  {/* ── Panel header ── */}
                  <button
                    onClick={() => toggleWeek(week.weekNo)}
                    className="w-full flex items-center gap-3 px-5 py-4 text-left hover:bg-slate-50 transition-colors focus:outline-none"

                    {/* Week badge */}

                    {/* Topic + due date */}

                    {/* Expand/collapse arrow */}
                    <svg

                  {/* ── Panel body ── */}
                  {isExpanded && (
                    <div className="border-t border-slate-200">
                      <div className="p-5 grid grid-cols-1 lg:grid-cols-3 gap-6">

                        {/* LEFT — Week Info */}

                            </div>
                            <div>
                              <p className="text-xs text-slate-500 font-medium">Due Date</p>
                              <p className="text-sm font-semibold text-slate-800 mt-0.5">{formatDueDate(week.dueDate)}</p>

                          <div>
                            <p className="text-xs font-semibold text-slate-600 uppercase tracking-wide mb-2">Tasks</p>

                          {/* Completion bar inside body */}
                          <div>
                            <div className="flex justify-between text-xs text-slate-500 mb-1">
                              <span>Week Completion</span>
                              <span className="font-semibold">{completionPct}%</span>
                            </div>
                            <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
                              <div className={`h-full rounded-full ${colourBar}`} style={{ width: `${completionPct}%` }} />
                            </div>
                          </div>
                        </div>

                        {/* RIGHT — Student Status Table */}
                        <div className="lg:col-span-2">
                          <h4 className="font-semibold text-slate-700 text-sm mb-3">
                            {role === 'student' ? 'Your Submission Status' : 'Student Submission Status'}
                          </h4>
                          <div className="rounded-xl border border-slate-200 overflow-hidden">
                            <div className="overflow-x-auto max-h-72 overflow-y-auto">
                              <table className="w-full text-sm">
                                <thead className="bg-slate-50 sticky top-0">

                                    <th className="px-3 py-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Name</th>
                                    <th className="px-3 py-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">Group</th>
                                    <th className="px-3 py-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Status</th>
                                    <th className="px-3 py-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Feedback</th>
                                    {role === 'lecturer' && (
                                      <th className="px-3 py-2 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">Actions</th>

                                </thead>
                                <tbody>
                                  {visibleStudents.length === 0 && (
                                    <tr>
                                      <td colSpan={role === 'lecturer' ? 6 : 5} className="px-3 py-6 text-center text-slate-400 text-xs">
                                        No students to display.
                                      </td>
                                    </tr>
                                  )}
                                  {visibleStudents.map(student => {
                                    const key = `${student.id}_${week.weekNo}`;
                                    const record = studentWeekStatus[key] || { status: 'Not Started', feedback: '' };
                                    const displayStatus = getDisplayStatus(record.status, week.dueDate);
                                    const feedbackText  = record.feedback || '';

                                    return (
                                      <tr key={student.id} className="border-t border-slate-100 hover:bg-slate-50 transition-colors">
                                        <td className="px-3 py-2 font-mono text-xs text-slate-500 whitespace-nowrap">{student.id}</td>
                                        <td className="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">{student.name}</td>
                                        <td className="px-3 py-2">
                                          <span className="inline-block bg-slate-100 text-slate-700 text-xs font-semibold px-2 py-0.5 rounded-full">{student.groupId}</span>
                                        </td>
                                        <td className="px-3 py-2 whitespace-nowrap">
                                          {role === 'lecturer' ? (
                                            <select
                                              value={record.status}
                                              onChange={e => handleStatusChange(student.id, week.weekNo, e.target.value)}
                                              className="text-xs border border-slate-200 rounded-lg px-2 py-1 bg-white focus:outline-none focus:ring-2 focus:ring-teal-400 cursor-pointer"
                                            >
                                              {STATUS_OPTIONS.map(s => (
                                                <option key={s} value={s}>{s}</option>
                                              ))}
                                            </select>
                                          ) : (
                                            <WeekStatusBadge status={displayStatus} />
                                          )}
                                          {/* Show overdue badge visually even when lecturer sees dropdown */}
                                          {role === 'lecturer' && displayStatus === 'Overdue' && (
                                            <span className="ml-1.5 inline-block text-[10px] font-bold bg-red-100 text-red-600 px-1.5 py-0.5 rounded-full">Overdue</span>
                                          )}
                                        </td>
                                        <td className="px-3 py-2 max-w-[160px]">
                                          {feedbackText ? (
                                            <span
                                              title={feedbackText}
                                              className="text-xs text-slate-600 truncate block cursor-help"
                                              style={{ maxWidth: '150px' }}
                                            >
                                              {feedbackText}
                                            </span>
                                          ) : (
                                            <span className="text-xs text-slate-300 italic">—</span>
                                          )}
                                        </td>
                                        {role === 'lecturer' && (
                                          <td className="px-3 py-2 whitespace-nowrap">

                                              onClick={() => setFeedbackModal({
                                                student,
                                                week,
                                                existingFeedback: feedbackText,

            <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
              {weeklyTopics.map(week => {
                const pct = getCompletionPct(week.weekNo);
                const isActive = expandedWeek === week.weekNo;
                const colBar = pct >= 75 ? 'bg-green-500' : pct >= 40 ? 'bg-teal-500' : 'bg-amber-400';

                  <button
                    key={week.weekNo}
                    onClick={() => scrollToWeek(week.weekNo)}
                    className={`rounded-xl border p-3 text-left transition-all hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-400
                      ${isActive ? 'border-[#1e3a5f] bg-[#1e3a5f] text-white shadow-md' : 'border-slate-200 bg-slate-50 hover:bg-white text-slate-800'}`}
                  >
                    <div className="flex items-center justify-between mb-1.5">
                      <span className={`text-xs font-bold ${isActive ? 'text-blue-200' : 'text-slate-400'}`}>W{week.weekNo}</span>
                      <span className={`text-xs font-bold ${isActive ? 'text-white' : pct >= 75 ? 'text-green-600' : pct >= 40 ? 'text-teal-600' : 'text-amber-600'}`}>

          {/* ── MODALS ── */}

            <WeekEditModal

            <FeedbackModal

              week={feedbackModal.week}
