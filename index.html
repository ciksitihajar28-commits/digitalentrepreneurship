    /* =====================================================================
     *  ScoreEditModal — Lecturer edits one student's 4 scores with live preview
     * ===================================================================== */
    function ScoreEditModal({ student, onClose, onSave }) {
      const assessments = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_assessments')) || []; } catch { return []; } }, []);
      const weights     = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_weights'))     || { quiz:20, assignment:30, project:40, presentation:10 }; } catch { return { quiz:20, assignment:30, project:40, presentation:10 }; } }, []);

      const existing = assessments.find(a => a.studentId === student.id) || { quiz:0, assignment:0, project:0, presentation:0 };

      const [quiz,  setQuiz]  = React.useState(String(existing.quiz));
      const [asgn,  setAsgn]  = React.useState(String(existing.assignment));
      const [proj,  setProj]  = React.useState(String(existing.project));
      const [pres,  setPres]  = React.useState(String(existing.presentation));
      const [errors, setErrors] = React.useState({});

      const toNum = v => { const n = Number(v); return isNaN(n) ? -1 : n; };

      const liveScore = React.useMemo(() => {
        const q = toNum(quiz), a = toNum(asgn), p = toNum(proj), pr = toNum(pres);
        if ([q,a,p,pr].some(x => x < 0 || x > 100)) return null;
        return computeWeightedScore({ quiz:q, assignment:a, project:p, presentation:pr }, weights);
      }, [quiz, asgn, proj, pres, weights]);

      const validate = () => {
        const e = {};
        [['quiz',quiz],['assignment',asgn],['project',proj],['presentation',pres]].forEach(([k,v]) => {
          const n = toNum(v);
          if (isNaN(n) || n < 0 || n > 100) e[k] = 'Must be 0–100';
        });
        return e;
      };

      const handleSave = () => {
        const e = validate();
        if (Object.keys(e).length) { setErrors(e); return; }
        onSave({ studentId: student.id, quiz: toNum(quiz), assignment: toNum(asgn), project: toNum(proj), presentation: toNum(pres) });
      };

      const gradeColour = g => ({
        A:'bg-green-100 text-green-700', B:'bg-blue-100 text-blue-700',
        C:'bg-amber-100 text-amber-700', D:'bg-orange-100 text-orange-700', F:'bg-red-100 text-red-700',
      }[g] || 'bg-slate-100 text-slate-600');

      const Field = ({ label, value, setter, wt, errKey }) => (
        <div>
          <label className="block text-xs font-semibold text-slate-600 mb-1">
            {label} <span className="text-slate-400 font-normal">(0–100, weight {wt}%)</span>
          </label>
          <input type="number" min={0} max={100} value={value}
            onChange={e => { setter(e.target.value); setErrors(p => { const n={...p}; delete n[errKey]; return n; }); }}
            className={`w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 ${errors[errKey] ? 'border-red-400' : 'border-slate-300'}`}
          />
          {errors[errKey] && <p className="text-red-500 text-xs mt-0.5">{errors[errKey]}</p>}
        </div>
      );

      return (
        <ModalShell title={`Edit Scores — ${student.name} (${student.id})`} onClose={onClose}>
          <div className="space-y-4">
            <div className="bg-slate-50 rounded-lg px-4 py-2 text-xs text-slate-500">
              Group: <span className="font-semibold text-slate-700">{student.groupId}</span>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Field label="Quiz"         value={quiz} setter={setQuiz} wt={weights.quiz}         errKey="quiz" />
              <Field label="Assignment"   value={asgn} setter={setAsgn} wt={weights.assignment}   errKey="assignment" />
              <Field label="Project"      value={proj} setter={setProj} wt={weights.project}      errKey="project" />
              <Field label="Presentation" value={pres} setter={setPres} wt={weights.presentation} errKey="presentation" />
            </div>

            {/* Live preview */}
            <div className={`rounded-xl px-4 py-3 flex items-center justify-between
              ${liveScore === null ? 'bg-slate-50 border border-slate-200' : liveScore < 50 ? 'bg-red-50 border border-red-200' : 'bg-green-50 border border-green-200'}`}>
              <div>
                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-0.5">Weighted Total (Live Preview)</p>
                <p className={`text-2xl font-bold ${liveScore === null ? 'text-slate-400' : liveScore < 50 ? 'text-red-700' : 'text-green-700'}`}>
                  {liveScore === null ? '—' : liveScore.toFixed(1) + '%'}
                </p>
              </div>
              {liveScore !== null && (
                <span className={`text-sm font-bold px-3 py-1 rounded-full ${gradeColour(getGrade(liveScore))}`}>
                  Grade {getGrade(liveScore)}
                </span>
              )}
            </div>

            <div className="flex justify-end gap-2 pt-2 border-t border-slate-200">
              <button onClick={onClose} className="px-4 py-2 text-sm border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50">Cancel</button>
              <button onClick={handleSave} className="px-4 py-2 text-sm bg-[#1e3a5f] text-white rounded-lg hover:bg-[#16304f]">Save Scores</button>
            </div>
          </div>
        </ModalShell>
      );
    }

    /* =====================================================================
     *  AtRiskNoteModal — Lecturer adds / views a note per at-risk student
     * ===================================================================== */
    function AtRiskNoteModal({ student, onClose }) {
      const notesKey = 'dep_studentNotes';
      const allNotes = React.useMemo(() => { try { return JSON.parse(localStorage.getItem(notesKey)) || {}; } catch { return {}; } }, []);
      const [note, setNote] = React.useState(allNotes[student.id] || '');
      const [saved, setSaved] = React.useState(false);

      const handleSave = () => {
        const updated = { ...allNotes, [student.id]: note };
        localStorage.setItem(notesKey, JSON.stringify(updated));
        setSaved(true);
        setTimeout(onClose, 800);
      };

      return (
        <ModalShell title={`Lecturer Note — ${student.name} (${student.id})`} onClose={onClose}>
          <div className="space-y-4">
            <p className="text-xs text-slate-500">Add a private note for this at-risk student. Notes are stored locally and visible only to the lecturer.</p>
            <textarea
              rows={5}
              value={note}
              onChange={e => { setNote(e.target.value); setSaved(false); }}
              placeholder="Enter your note or recommended intervention here…"
              className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"
            />
            {saved && <p className="text-green-600 text-xs font-medium">✓ Note saved!</p>}
            <div className="flex justify-end gap-2 pt-2 border-t border-slate-200">
              <button onClick={onClose} className="px-4 py-2 text-sm border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50">Close</button>
              <button onClick={handleSave} className="px-4 py-2 text-sm bg-[#1e3a5f] text-white rounded-lg hover:bg-[#16304f]">Save Note</button>
            </div>
          </div>
        </ModalShell>
      );
    }

    /* =====================================================================
     *  AssessmentsPage — full implementation
     * ===================================================================== */
    function AssessmentsPage() {
      const { role, currentUser } = useApp();

      // ── localStorage state ────────────────────────────────────────────
      const [assessments, setAssessments] = useLocalStorage('dep_assessments', []);
      const [weights, setWeights]         = useLocalStorage('dep_weights', { quiz:20, assignment:30, project:40, presentation:10 });

      const students = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_students')) || []; } catch { return []; } }, []);
      const groups   = React.useMemo(() => { try { return JSON.parse(localStorage.getItem('dep_groups'))   || []; } catch { return []; } }, []);

      // ── Filters ───────────────────────────────────────────────────────
      const [search,       setSearch]       = React.useState('');
      const [filterGroup,  setFilterGroup]  = React.useState('All');
      const [filterClass,  setFilterClass]  = React.useState('All');
      const [filterGrade,  setFilterGrade]  = React.useState('All');

      // ── Weights editor state ──────────────────────────────────────────
      const [weightsOpen,  setWeightsOpen]  = React.useState(false);
      const [wQuiz,        setWQuiz]        = React.useState(String(weights.quiz));
      const [wAsgn,        setWAsgn]        = React.useState(String(weights.assignment));
      const [wProj,        setWProj]        = React.useState(String(weights.project));
      const [wPres,        setWPres]        = React.useState(String(weights.presentation));

      // ── Sync local weight fields when weights change externally ───────
      React.useEffect(() => {
        setWQuiz(String(weights.quiz));
        setWAsgn(String(weights.assignment));
        setWProj(String(weights.project));
        setWPres(String(weights.presentation));
      }, [weights.quiz, weights.assignment, weights.project, weights.presentation]);

      const wTotal = [wQuiz, wAsgn, wProj, wPres].reduce((s, v) => s + (Number(v) || 0), 0);
      const wValid = wTotal === 100 && [wQuiz, wAsgn, wProj, wPres].every(v => Number(v) >= 0 && Number(v) <= 100 && v !== '');

      const handleSaveWeights = () => {
        if (!wValid) return;
        setWeights({ quiz: Number(wQuiz), assignment: Number(wAsgn), project: Number(wProj), presentation: Number(wPres) });
        setWeightsOpen(false);
      };

      const handleResetWeights = () => {
        const def = { quiz:20, assignment:30, project:40, presentation:10 };
        setWeights(def);
        setWQuiz('20'); setWAsgn('30'); setWProj('40'); setWPres('10');
      };

      // ── Modal state ───────────────────────────────────────────────────
      const [editModal,   setEditModal]   = React.useState(null);  // student
      const [noteModal,   setNoteModal]   = React.useState(null);  // student

      // ── Build enriched student rows ───────────────────────────────────
      const allRows = React.useMemo(() => {
        const visibleStudents = role === 'student'
          ? students.filter(s => s.id === currentUser?.id)
          : students;
        return visibleStudents.map(s => {
          const a   = assessments.find(x => x.studentId === s.id) || { quiz:0, assignment:0, project:0, presentation:0 };
          const ws  = computeWeightedScore(a, weights);
          const gr  = getGrade(ws);
          return { ...s, quiz: a.quiz, assignment: a.assignment, project: a.project, presentation: a.presentation, weighted: ws, grade: gr, atRisk: ws < 50 };
        });
      }, [students, assessments, weights, role, currentUser]);

      // ── Filter ────────────────────────────────────────────────────────
      const gradeInBand = (gr, band) => {
        if (band === 'All') return true;
        if (band === 'A') return gr === 'A';
        if (band === 'B') return gr === 'B';
        if (band === 'C') return gr === 'C';
        if (band === 'D') return gr === 'D';
        if (band === 'F') return gr === 'F';
        return true;
      };

      const filteredRows = React.useMemo(() => {
        const q = search.toLowerCase();
        return allRows.filter(s => {
          if (filterGroup !== 'All' && s.groupId !== filterGroup) return false;
          if (filterClass !== 'All' && s.class !== filterClass) return false;
          if (!gradeInBand(s.grade, filterGrade)) return false;
          if (q && !s.id.toLowerCase().includes(q) && !s.name.toLowerCase().includes(q)) return false;
          return true;
        });
      }, [allRows, search, filterGroup, filterClass, filterGrade]);

      // ── Group the filtered rows (for group average rows) ──────────────
      const groupedRows = React.useMemo(() => {
        const map = {};
        filteredRows.forEach(s => {
          if (!map[s.groupId]) map[s.groupId] = [];
          map[s.groupId].push(s);
        });
        // Preserve original group order
        const orderedGroupIds = groups.map(g => g.id).filter(id => map[id]);
        return orderedGroupIds.map(gid => ({ groupId: gid, rows: map[gid] }));
      }, [filteredRows, groups]);

      // ── KPI computations ─────────────────────────────────────────────
      const kpis = React.useMemo(() => {
        if (!allRows.length) return { avg: 0, highest: null, lowest: null, atRiskCount: 0 };
        const sorted = [...allRows].sort((a, b) => b.weighted - a.weighted);
        return {
          avg:         allRows.reduce((s, r) => s + r.weighted, 0) / allRows.length,
          highest:     sorted[0],
          lowest:      sorted[sorted.length - 1],
          atRiskCount: allRows.filter(r => r.atRisk).length,
        };
      }, [allRows]);

      // ── Performance distribution ──────────────────────────────────────
      const gradeDist = React.useMemo(() => {
        const counts = { A:0, B:0, C:0, D:0, F:0 };
        allRows.forEach(r => counts[r.grade]++);
        return counts;
      }, [allRows]);

      // ── Chart ─────────────────────────────────────────────────────────
      const chartRef = React.useRef(null);
      const chartIns = React.useRef(null);

      React.useEffect(() => {
        if (!chartRef.current || typeof Chart === 'undefined') return;
        if (chartIns.current) { chartIns.current.destroy(); chartIns.current = null; }
        const total = allRows.length || 1;
        chartIns.current = new Chart(chartRef.current, {
          type: 'doughnut',
          data: {
            labels: ['A (≥80%)', 'B (65–79%)', 'C (50–64%)', 'D (40–49%)', 'F (<40%)'],
            datasets: [{
              data: [gradeDist.A, gradeDist.B, gradeDist.C, gradeDist.D, gradeDist.F],
              backgroundColor: ['#22c55e','#14b8a6','#3b82f6','#f59e0b','#ef4444'],
              borderWidth: 2, borderColor: '#ffffff',
            }],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            cutout: '60%',
            plugins: {
              legend: {
                position: 'bottom',
                labels: { boxWidth: 12, padding: 10, font: { size: 11 },
                  generateLabels: chart => {
                    const ds = chart.data.datasets[0];
                    return chart.data.labels.map((label, i) => ({
                      text: `${label}: ${ds.data[i]} (${((ds.data[i]/total)*100).toFixed(0)}%)`,
                      fillStyle: ds.backgroundColor[i],
                      strokeStyle: ds.backgroundColor[i],
                      lineWidth: 0,
                      hidden: false,
                      index: i,
                    }));
                  },
                },
              },
              tooltip: {
                callbacks: {
                  label: ctx => ` ${ctx.label}: ${ctx.parsed} student${ctx.parsed !== 1 ? 's' : ''} (${((ctx.parsed/total)*100).toFixed(1)}%)`,
                },
              },
            },
          },
        });
        return () => { if (chartIns.current) { chartIns.current.destroy(); chartIns.current = null; } };
      }, [gradeDist, allRows.length]);

      // ── Save edited scores ────────────────────────────────────────────
      const handleScoreSave = (updatedAssess) => {
        setAssessments(prev => {
          const exists = prev.find(a => a.studentId === updatedAssess.studentId);
          return exists ? prev.map(a => a.studentId === updatedAssess.studentId ? updatedAssess : a) : [...prev, updatedAssess];
        });
        setEditModal(null);
      };

      // ── Grade badge helper ────────────────────────────────────────────
      const GradeBadge = ({ grade }) => {
        const cls = {
          A:'bg-green-100 text-green-700', B:'bg-blue-100 text-blue-700',
          C:'bg-amber-100 text-amber-700', D:'bg-orange-100 text-orange-700', F:'bg-red-100 text-red-700',
        }[grade] || 'bg-slate-100 text-slate-600';
        return <span className={`inline-block text-xs font-bold px-2 py-0.5 rounded-full ${cls}`}>{grade}</span>;
      };

      // ── At-risk students ──────────────────────────────────────────────
      const atRiskStudents = allRows.filter(r => r.atRisk);

      // ── Render ────────────────────────────────────────────────────────
      return (
        <div className="space-y-6">
          {/* DEMO banner */}
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 text-xs text-amber-700 font-medium text-center">
            ⚠ DEMO DATA — For Teaching and Demonstration Purposes Only
          </div>

          {/* ── 1. WEIGHTS EDITOR (Lecturer only) ──────────────────────── */}
          {role === 'lecturer' && (
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <button
                onClick={() => setWeightsOpen(o => !o)}
                className="w-full flex items-center justify-between px-5 py-4 text-left hover:bg-slate-50 transition-colors"
              >
                <div className="flex items-center gap-3">
                  <span className="text-lg">⚖️</span>
                  <div>
                    <p className="font-bold text-slate-800 text-sm">Assessment Weights Editor</p>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Current: Quiz {weights.quiz}% · Assignment {weights.assignment}% · Project {weights.project}% · Presentation {weights.presentation}%
                    </p>
                  </div>
                </div>
                <span className={`text-slate-400 transition-transform ${weightsOpen ? 'rotate-180' : ''}`}>▼</span>
              </button>

              {weightsOpen && (
                <div className="border-t border-slate-200 px-5 py-4 space-y-4">
                  <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-xs text-amber-700">
                    ⚠️ These weights are for demonstration purposes only and are not official course assessment requirements.
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    {[
                      { label:'Quiz',         value:wQuiz, setter:setWQuiz },
                      { label:'Assignment',   value:wAsgn, setter:setWAsgn },
                      { label:'Project',      value:wProj, setter:setWProj },
                      { label:'Presentation', value:wPres, setter:setWPres },
                    ].map(({ label, value, setter }) => (
                      <div key={label}>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">{label} %</label>
                        <input
                          type="number" min={0} max={100}
                          value={value}
                          onChange={e => setter(e.target.value)}
                          className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                        />
                      </div>
                    ))}
                  </div>

                  {/* Total display */}
                  <div className={`flex items-center justify-between rounded-lg px-4 py-2 text-sm font-semibold
                    ${wValid ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'}`}>
                    <span>Total: {wTotal}%</span>
                    {!wValid && <span className="text-xs font-semibold">Weights must sum to 100%</span>}
                    {wValid && <span className="text-xs">✓ Valid</span>}
                  </div>

                  <div className="flex items-center gap-3 pt-1">
                    <button onClick={handleResetWeights}
                      className="text-xs text-slate-500 hover:text-slate-700 underline font-medium">
                      Reset to Default
                    </button>
                    <div className="flex-1" />
                    <button onClick={() => setWeightsOpen(false)}
                      className="px-4 py-2 text-sm border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50">
                      Cancel
                    </button>
                    <button onClick={handleSaveWeights} disabled={!wValid}
                      className={`px-4 py-2 text-sm rounded-lg font-medium transition-colors
                        ${wValid ? 'bg-[#1e3a5f] text-white hover:bg-[#16304f]' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                      Save Weights
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ── 2. KPI CARDS ───────────────────────────────────────────── */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <KpiCard icon="🎯" label="Class Average" variant="blue"
              value={kpis.avg.toFixed(1) + '%'}
              sublabel={`Across ${allRows.length} students`}
              onClick={() => {}} />
            <KpiCard icon="🏆" label="Highest Score" variant="green"
              value={kpis.highest ? kpis.highest.weighted.toFixed(1) + '%' : '—'}
              sublabel={kpis.highest?.name || '—'}
              onClick={() => {}} />
            <KpiCard icon="📉" label="Lowest Score" variant="amber"
              value={kpis.lowest ? kpis.lowest.weighted.toFixed(1) + '%' : '—'}
              sublabel={kpis.lowest?.name || '—'}
              onClick={() => {}} />
            <KpiCard icon="⚠️" label="Students At Risk" variant="red"
              value={String(kpis.atRiskCount)}
              sublabel={`Weighted score < 50%`}
              onClick={() => {}} />
          </div>

          {/* ── 3. FILTER ROW ──────────────────────────────────────────── */}
          <div className="bg-white rounded-xl shadow-sm border border-slate-200 px-5 py-4">
            <div className="flex flex-wrap items-center gap-3">
              <span className="text-sm font-medium text-slate-600">🔍 Filters:</span>

              {/* Search */}
              <input
                placeholder="Name or ID…"
                value={search} onChange={e => setSearch(e.target.value)}
                className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 w-44"
              />

              {/* Group filter (lecturer only) */}
              {role === 'lecturer' && (
                <select value={filterGroup} onChange={e => setFilterGroup(e.target.value)}
                  className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                  <option value="All">All Groups</option>
                  {groups.map(g => <option key={g.id} value={g.id}>{g.id}</option>)}
                </select>
              )}

              {/* Class filter (lecturer only) */}
              {role === 'lecturer' && (
                <select value={filterClass} onChange={e => setFilterClass(e.target.value)}
                  className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                  <option value="All">All Classes</option>
                  <option value="DPU4A">DPU4A</option>
                  <option value="DPU4B">DPU4B</option>
                </select>
              )}

              {/* Grade filter */}
              <select value={filterGrade} onChange={e => setFilterGrade(e.target.value)}
                className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="All">All Grades</option>
                <option value="A">A (≥80%)</option>
                <option value="B">B (65–79%)</option>
                <option value="C">C (50–64%)</option>
                <option value="D">D (40–49%)</option>
                <option value="F">F (&lt;40%)</option>
              </select>

              {/* Reset */}
              <button onClick={() => { setSearch(''); setFilterGroup('All'); setFilterClass('All'); setFilterGrade('All'); }}
                className="text-xs text-blue-600 hover:text-blue-800 font-medium underline">
                Reset
              </button>
            </div>
          </div>

          {/* ── 4 + 5. TABLE + CHART (side-by-side on xl) ─────────────── */}
          <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">

            {/* TABLE — takes 2/3 of xl grid */}
            <div className="xl:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="px-5 py-3 border-b border-slate-200">
                <h3 className="font-bold text-slate-800 text-sm">Assessment Scores</h3>
                <p className="text-xs text-slate-400 mt-0.5">
                  {filteredRows.length} student{filteredRows.length !== 1 ? 's' : ''} shown
                  {role === 'student' ? ' — Your own record only' : ''}
                </p>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead className="bg-slate-50 border-b border-slate-200">
                    <tr>
                      {['ID','Name','Group','Quiz','Assign','Project','Pres','Weighted','Grade','Status',...(role==='lecturer'?['Actions']:[])].map(h => (
                        <th key={h} className="px-3 py-2.5 text-left text-xs font-semibold text-slate-500 uppercase tracking-wide whitespace-nowrap">{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {groupedRows.length === 0 && (
                      <tr>
                        <td colSpan={role === 'lecturer' ? 11 : 10} className="px-4 py-8 text-center text-slate-400">
                          No students match the current filters.
                        </td>
                      </tr>
                    )}

                    {groupedRows.map(({ groupId, rows }) => (
                      <React.Fragment key={groupId}>
                        {rows.map(s => (
                          <tr key={s.id} className={`border-t border-slate-100 transition-colors ${s.atRisk ? 'bg-red-50/50 hover:bg-red-50' : 'hover:bg-slate-50'}`}>
                            <td className="px-3 py-2 font-mono text-xs text-slate-600 whitespace-nowrap">{s.id}</td>
                            <td className="px-3 py-2 font-medium text-slate-800 whitespace-nowrap max-w-[140px] truncate">{s.name}</td>
                            <td className="px-3 py-2">
                              <span className="inline-block bg-slate-100 text-slate-700 text-xs font-semibold px-2 py-0.5 rounded-full">{s.groupId}</span>
                            </td>
                            <td className="px-3 py-2 text-slate-700">{s.quiz}</td>
                            <td className="px-3 py-2 text-slate-700">{s.assignment}</td>
                            <td className="px-3 py-2 text-slate-700">{s.project}</td>
                            <td className="px-3 py-2 text-slate-700">{s.presentation}</td>
                            <td className="px-3 py-2 font-bold text-slate-800 whitespace-nowrap">
                              {s.weighted.toFixed(1)}%
                            </td>
                            <td className="px-3 py-2"><GradeBadge grade={s.grade} /></td>
                            <td className="px-3 py-2">
                              {s.atRisk
                                ? <span className="inline-block bg-red-100 text-red-700 text-[11px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap">⚠ At Risk</span>
                                : <span className="inline-block bg-green-100 text-green-700 text-[11px] font-semibold px-2 py-0.5 rounded-full">Active</span>
                              }
                            </td>
                            {role === 'lecturer' && (
                              <td className="px-3 py-2">
                                <button
                                  onClick={() => setEditModal(students.find(x => x.id === s.id) || s)}
                                  className="text-xs bg-[#1e3a5f] text-white px-2.5 py-1 rounded-lg hover:bg-[#16304f] transition-colors whitespace-nowrap">
                                  Edit Scores
                                </button>
                              </td>
                            )}
                          </tr>
                        ))}

                        {/* Group average row */}
                        {rows.length > 0 && (() => {
                          const avg = f => rows.reduce((s, r) => s + (r[f] || 0), 0) / rows.length;
                          const avgW = rows.reduce((s, r) => s + r.weighted, 0) / rows.length;
                          const avgGrade = getGrade(avgW);
                          return (
                            <tr className="border-t border-slate-200 bg-slate-100/80">
                              <td className="px-3 py-2 text-xs font-bold text-slate-600" colSpan={2}>{groupId} Average</td>
                              <td className="px-3 py-2 text-xs text-slate-400">—</td>
                              <td className="px-3 py-2 text-xs font-semibold text-slate-700">{avg('quiz').toFixed(1)}</td>
                              <td className="px-3 py-2 text-xs font-semibold text-slate-700">{avg('assignment').toFixed(1)}</td>
                              <td className="px-3 py-2 text-xs font-semibold text-slate-700">{avg('project').toFixed(1)}</td>
                              <td className="px-3 py-2 text-xs font-semibold text-slate-700">{avg('presentation').toFixed(1)}</td>
                              <td className="px-3 py-2 text-xs font-bold text-slate-800">{avgW.toFixed(1)}%</td>
                              <td className="px-3 py-2"><GradeBadge grade={avgGrade} /></td>
                              <td className="px-3 py-2 text-xs text-slate-400">—</td>
                              {role === 'lecturer' && <td className="px-3 py-2 text-xs text-slate-400">—</td>}
                            </tr>
                          );
                        })()}
                      </React.Fragment>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* CHART — takes 1/3 of xl grid */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col">
              <div className="mb-4">
                <h3 className="font-bold text-slate-800 text-sm">Performance Distribution</h3>
                <p className="text-xs text-slate-400 mt-0.5">Grade bands across {allRows.length} students</p>
              </div>

              {/* Doughnut chart */}
              <div style={{ height:'220px', position:'relative' }}>
                <canvas id="assessChart1" ref={chartRef}></canvas>
              </div>

              {/* Grade band summary */}
              <div className="mt-4 grid grid-cols-5 gap-1.5">
                {[
                  { grade:'A', count: gradeDist.A, colour:'bg-green-500' },
                  { grade:'B', count: gradeDist.B, colour:'bg-teal-500'  },
                  { grade:'C', count: gradeDist.C, colour:'bg-blue-500'  },
                  { grade:'D', count: gradeDist.D, colour:'bg-amber-500' },
                  { grade:'F', count: gradeDist.F, colour:'bg-red-500'   },
                ].map(({ grade, count, colour }) => (
                  <div key={grade} className="text-center">
                    <div className={`h-1.5 rounded-full ${colour} mb-1`} />
                    <p className="text-xs font-bold text-slate-700">{count}</p>
                    <p className="text-[10px] text-slate-500">{grade}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* ── 6. AT-RISK SECTION ─────────────────────────────────────── */}
          {atRiskStudents.length > 0 && (
            <div className="bg-white rounded-xl shadow-sm border border-red-200">
              {/* Header */}
              <div className="flex items-center gap-3 px-5 py-4 border-b border-red-200 bg-red-50 rounded-t-xl">
                <span className="text-lg">⚠️</span>
                <div>
                  <h3 className="font-bold text-red-800 text-sm">
                    Students Requiring Academic Support ({atRiskStudents.length} student{atRiskStudents.length !== 1 ? 's' : ''})
                  </h3>
                  <p className="text-xs text-red-600 mt-0.5">Students with weighted score below 50%</p>
                </div>
              </div>

              student={editModal}

    }
    /* =====================================================================
     *  exportToCSV — top-level utility
     * ===================================================================== */
    function exportToCSV(rows, filename) {
      if (!rows || !rows.length) return;
      const header = Object.keys(rows[0]);
      const csv = [
        header.join(','),
        ...rows.map(r => header.map(h => JSON.stringify(r[h] ?? '')).join(',')),
      ].join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    /* =====================================================================
     *  ReportsPage — Page 7
     * ===================================================================== */
    function ReportsPage() {
      const { role } = useApp();

      // ── localStorage reads ────────────────────────────────────────────
      const [students]    = useLocalStorage('dep_students',            []);
      const [assessments] = useLocalStorage('dep_assessments',         []);
      const [weights]     = useLocalStorage('dep_weights',             { quiz:20, assignment:30, project:40, presentation:10 });
      const [projects]    = useLocalStorage('dep_projects',            []);
      const [weeklyData]  = useLocalStorage('dep_weeklyData',          []);
      const [weeklyTopics]= useLocalStorage('dep_weeklyTopics',        []);
      const [swStatus]    = useLocalStorage('dep_studentWeeklyStatus', {});
      const [groups]      = useLocalStorage('dep_groups',              []);
      const [cqiRecords,  setCqiRecords] = useLocalStorage('dep_cqi',  []);

      // ── CQI form state ────────────────────────────────────────────────
      const today = new Date().toISOString().slice(0, 10);
      const [cqiDate,        setCqiDate]        = React.useState(today);
      const [cqiObservation, setCqiObservation] = React.useState('');
      const [cqiChallenges,  setCqiChallenges]  = React.useState('');
      const [cqiStrategies,  setCqiStrategies]  = React.useState('');
      const [cqiActions,     setCqiActions]      = React.useState('');
      const [cqiEvidence,    setCqiEvidence]    = React.useState('');
      const [editModal,      setEditModal]       = React.useState(null);
      const [expandedCells,  setExpandedCells]   = React.useState({});   // { `${idx}_col`: true }

      // ── Enriched student rows ─────────────────────────────────────────
      const allRows = React.useMemo(() => students.map(s => {
        const a  = assessments.find(x => x.studentId === s.id) || { quiz:0, assignment:0, project:0, presentation:0 };
        const ws = computeWeightedScore(a, weights);
        const gr = getGrade(ws);
        return { ...s, quiz: a.quiz, assignment: a.assignment, project: a.project, presentation: a.presentation, weighted: ws, grade: gr };
      }), [students, assessments, weights]);

      // ── Card 1: Class Performance ─────────────────────────────────────
      const classPerf = React.useMemo(() => {
        if (!allRows.length) return { avg: 0, passRate: 0, dist: { A:0,B:0,C:0,D:0,F:0 } };
        const avg      = allRows.reduce((s, r) => s + r.weighted, 0) / allRows.length;
        const passRate = (allRows.filter(r => r.weighted >= 50).length / allRows.length) * 100;
        const dist     = { A:0, B:0, C:0, D:0, F:0 };
        allRows.forEach(r => dist[r.grade]++);
        return { avg, passRate, dist };
      }, [allRows]);

      // ── Card 2: Business Projects ─────────────────────────────────────
      const projPerf = React.useMemo(() => {
        const active  = projects.filter(p => p.status === 'Active').length;
        const total   = projects.length;
        const avgProg = total ? projects.reduce((s, p) => s + (p.businessProgress || 0), 0) / total : 0;

        const groupNetProfit = {};
        weeklyData.forEach(r => {
          groupNetProfit[r.groupId] = (groupNetProfit[r.groupId] || 0) + r.netProfit;
        });
        const profits = Object.values(groupNetProfit);
        const avgNet  = profits.length ? profits.reduce((a, b) => a + b, 0) / profits.length : 0;

        return { active, total, avgProg, avgNet };
      }, [projects, weeklyData]);

      // ── Card 3: Weekly Engagement ─────────────────────────────────────
      const engPerf = React.useMemo(() => {
        const pastWeeks  = weeklyTopics.filter(w => w.status === 'Completed' || w.status === 'In Progress');
        const possible   = students.length * 14;
        let submitted = 0, overdue = 0;
        students.forEach(s => {
          weeklyTopics.forEach(w => {
            const entry = swStatus[`${s.id}_${w.weekNo}`];
            if (!entry) return;
            if (entry.status === 'Submitted' || entry.status === 'Completed') submitted++;
            if (entry.status === 'Not Started' && w.status === 'Completed') overdue++;
          });
        });
        const rate = possible > 0 ? (submitted / possible) * 100 : 0;
        return { submitted, possible, rate, overdue };
      }, [students, weeklyTopics, swStatus]);

      // ── Card 4: Sales & Revenue ───────────────────────────────────────
      const salesPerf = React.useMemo(() => {
        let totalRev = 0, totalExp = 0;
        const groupNet = {};
        weeklyData.forEach(r => {
          totalRev += r.revenue;
          totalExp += r.expenses;
          groupNet[r.groupId] = (groupNet[r.groupId] || 0) + r.netProfit;
        });
        const netProfit = totalRev - totalExp;
        const best = Object.entries(groupNet).sort((a, b) => b[1] - a[1])[0];
        const bestGroup = best ? best[0] : '—';
        const bestProj  = projects.find(p => groups.find(g => g.id === bestGroup && g.projectId === p.id));
        return { totalRev, totalExp, netProfit, bestGroup, bestProjName: bestProj ? bestProj.name : bestGroup };
      }, [weeklyData, projects, groups]);

      // ── Card 5: Assessment Completion ─────────────────────────────────
      const assessPerf = React.useMemo(() => {
        const fullyAssessed = students.filter(s => {
          const a = assessments.find(x => x.studentId === s.id);
          return a && a.quiz > 0 && a.assignment > 0 && a.project > 0 && a.presentation > 0;
        }).length;
        const pending = students.length - fullyAssessed;
        const rate    = students.length ? (fullyAssessed / students.length) * 100 : 0;
        return { fullyAssessed, pending, rate };
      }, [students, assessments]);

      // ── Card 6: Students Needing Support ──────────────────────────────
      const supportPerf = React.useMemo(() => {
        const atRisk   = allRows.filter(r => r.weighted < 50);
        const critical = allRows.filter(r => r.weighted < 40);
        const groupAvg = {};
        allRows.forEach(r => {
          if (!groupAvg[r.groupId]) groupAvg[r.groupId] = [];
          groupAvg[r.groupId].push(r.weighted);
        });
        const classAvg = classPerf.avg;
        const belowAvgGroups = Object.entries(groupAvg)
          .filter(([, scores]) => scores.reduce((a, b) => a + b, 0) / scores.length < classAvg)

        return { atRiskCount: atRisk.length, criticalCount: critical.length, belowAvgGroups };
      }, [allRows, classPerf.avg]);

        setEditModal(null);

      const toggleCell = (key) => setExpandedCells(prev => ({ ...prev, [key]: !prev[key] }));

      const truncate = (text, key) => {
        if (!text) return <span className="text-slate-400 text-xs italic">—</span>;

          );
        }
        return (
          <span>
            {text.slice(0, 80)}…
            <button onClick={() => toggleCell(key)} className="ml-1 text-blue-600 text-xs hover:underline">Show more</button>
          </span>
        );
      };

      // ── CSV export handlers ───────────────────────────────────────────
      const handleExportStudents = () => {
        const rows = students.map(s => {
          const a  = assessments.find(x => x.studentId === s.id) || { quiz:0, assignment:0, project:0, presentation:0 };
          const ws = computeWeightedScore(a, weights);
          const gr = getGrade(ws);
          const proj = projects.find(p => groups.find(g => g.id === s.groupId && g.projectId === p.id));
          return {
            'Student ID': s.id, 'Student Name': s.name, 'Class': s.class, 'Group ID': s.groupId,
            'Business Project': proj ? proj.name : '—',
            'Quiz Score': a.quiz, 'Assignment Score': a.assignment, 'Project Score': a.project, 'Presentation Score': a.presentation,
            'Weighted Total': ws.toFixed(2), 'Grade': gr,
            'Status': ws >= 50 ? 'Pass' : 'At Risk',
          };
        });
        exportToCSV(rows, 'dep_students_export.csv');
      };

      const handleExportProjects = () => {

              </ReportCard>

              <ReportCard title="Weekly Engagement" icon="📅" color="purple">
                <StatRow label="Total Submissions"  value={`${engPerf.submitted} / ${engPerf.possible}`} />

                  <StatRow label="Total Expenses"  value={formatRM(salesPerf.totalExp)}  valueClass="text-red-600" />
                  <StatRow label="Net Profit"      value={formatRM(salesPerf.netProfit)} valueClass="text-green-800 font-bold" />

              <ReportCard title="Students Needing Support" icon="🆘" color="red">
                <StatRow label="At-Risk (< 50%)"   value={supportPerf.atRiskCount}   valueClass={supportPerf.atRiskCount > 0 ? 'text-amber-700' : 'text-green-700'} />

                <StatRow label="Below-Avg Groups"  value={supportPerf.belowAvgGroups.length > 0 ? supportPerf.belowAvgGroups.join(', ') : 'None'} valueClass={supportPerf.belowAvgGroups.length > 0 ? 'text-amber-700' : 'text-green-700'} />

    // ── Lecturer settings view ──────────────────────────────────────────
    function LecturerSettingsView() {
      // ── Section 1: Course Information ────────────────────────────────
      const [settings, setSettings] = useLocalStorage('dep_settings', {
        institution: 'Politeknik Port Dickson',
        courseCode: 'DPU30013',
        courseName: 'Digital Entrepreneurship',
        academicYear: '2024/2025',
        semester: 2,
        weeks: 14,
        startDate: '',
      });

      const [instit,   setInstit]   = React.useState(settings.institution  || 'Politeknik Port Dickson');
      const [code,     setCode]     = React.useState(settings.courseCode   || 'DPU30013');
      const [cname,    setCname]    = React.useState(settings.courseName   || 'Digital Entrepreneurship');
      const [year,     setYear]     = React.useState(settings.academicYear || '2024/2025');
      const [sem,      setSem]      = React.useState(String(settings.semester || 2));
      const [weeks,    setWeeks]    = React.useState(String(settings.weeks || 14));
      const [startDate,setStartDate]= React.useState(settings.startDate   || '');
      const [savedCourse, setSavedCourse] = React.useState(false);

      const handleSaveCourse = () => {
        setSettings({
          institution: instit, courseCode: code, courseName: cname,
          academicYear: year, semester: Number(sem), weeks: Number(weeks), startDate,
        });
        setSavedCourse(true);
        setTimeout(() => setSavedCourse(false), 2000);
      };

      // ── Section 2: Assessment Weights ────────────────────────────────
      const [weights, setWeights] = useLocalStorage('dep_weights', { quiz:20, assignment:30, project:40, presentation:10 });
      const [wQuiz, setWQuiz] = React.useState(String(weights.quiz));
      const [wAsgn, setWAsgn] = React.useState(String(weights.assignment));
      const [wProj, setWProj] = React.useState(String(weights.project));
      const [wPres, setWPres] = React.useState(String(weights.presentation));

      React.useEffect(() => {
        setWQuiz(String(weights.quiz));
        setWAsgn(String(weights.assignment));
        setWProj(String(weights.project));
        setWPres(String(weights.presentation));
      }, [weights.quiz, weights.assignment, weights.project, weights.presentation]);

      const wTotal = [wQuiz, wAsgn, wProj, wPres].reduce((s, v) => s + (Number(v) || 0), 0);
      const wValid = wTotal === 100 && [wQuiz, wAsgn, wProj, wPres].every(v => Number(v) >= 0 && Number(v) <= 100 && v !== '');
      const [savedWeights, setSavedWeights] = React.useState(false);

      const handleSaveWeights = () => {
        if (!wValid) return;
        setWeights({ quiz: Number(wQuiz), assignment: Number(wAsgn), project: Number(wProj), presentation: Number(wPres) });
        setSavedWeights(true);
        setTimeout(() => setSavedWeights(false), 2000);
      };

      const handleResetWeights = () => {
        const def = { quiz:20, assignment:30, project:40, presentation:10 };
        setWeights(def);
        setWQuiz('20'); setWAsgn('30'); setWProj('40'); setWPres('10');
      };

      // ── Section 3: Appearance ─────────────────────────────────────────
      const [theme, setTheme] = React.useState(() => localStorage.getItem('dep_theme') || 'light');

      const handleThemeChange = (val) => {
        setTheme(val);
        localStorage.setItem('dep_theme', val);
        if (val === 'dark') {
          document.documentElement.classList.add('dark-mode');
        } else {
          document.documentElement.classList.remove('dark-mode');
        }
      };

      // ── Section 4: Data Management ────────────────────────────────────
      const [confirmModal, setConfirmModal] = React.useState(null);
      // confirmModal: { type, message, onConfirm }
      const [importError, setImportError] = React.useState('');
      const fileInputRef = React.useRef(null);

      const DEP_KEYS = [
        'dep_students','dep_groups','dep_projects','dep_weeklyData',
        'dep_weeklyTopics','dep_studentWeeklyStatus','dep_assessments',
        'dep_weights','dep_cqi','dep_settings','dep_theme','dep_seeded',
      ];

      const handleExport = () => {
        const data = {};
        DEP_KEYS.forEach(k => {
          const v = localStorage.getItem(k);
          if (v !== null) { try { data[k] = JSON.parse(v); } catch { data[k] = v; } }
        });
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        const today = new Date().toISOString().slice(0, 10);
        a.href     = url;
        a.download = `dep_backup_${today}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (typeof parsed !== 'object' || Array.isArray(parsed)) {
              setImportError('Invalid JSON: must be an object with dep_* keys.');
              return;
            }
            setImportError('');
            setConfirmModal({
              type: 'import',
              message: 'This will REPLACE all current data with the imported file. Continue?',
              onConfirm: () => {
                Object.keys(parsed).forEach(k => {
                  localStorage.setItem(k, JSON.stringify(parsed[k]));
                });
                window.location.reload();
              },
            });
          } catch {
            setImportError('Malformed JSON file. Please select a valid backup file.');
          }
        };
        reader.readAsText(file);
        // reset input so the same file can be re-selected
        e.target.value = '';
      };

      const ConfirmModal = ({ modal, onClose }) => (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40">
          <div className="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md mx-4 p-6 space-y-4">
            <h3 className="text-base font-bold text-slate-800">⚠️ Confirm Action</h3>
            <p className="text-sm text-slate-600">{modal.message}</p>
            <div className="flex gap-3 justify-end pt-2">
              <button onClick={onClose}
                className="px-4 py-2 text-sm border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50">
                Cancel
              </button>
              <button
                onClick={() => { onClose(); modal.onConfirm(); }}
                className="px-4 py-2 text-sm bg-red-600 text-white rounded-lg hover:bg-red-700 font-medium">
                Confirm
              </button>
            </div>
          </div>
        </div>
      );

      // ── Input helper ──────────────────────────────────────────────────
      const Field = ({ label, value, onChange, type = 'text', min, max, required }) => (
        <div>
          <label className="block text-xs font-semibold text-slate-600 mb-1">{label}</label>
          <input
            type={type} value={value} onChange={e => onChange(e.target.value)}
            min={min} max={max} required={required}
            className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          />
        </div>
      );

      // ── Render ────────────────────────────────────────────────────────
      return (
        <div className="space-y-6">
          {/* Demo banner */}
          <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 text-xs text-amber-700 font-medium text-center">
            ⚠ DEMO DATA — For Teaching and Demonstration Purposes Only
          </div>

          {/* ── SECTION 1: Course Information ──────────────────────────── */}
          <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
            <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
              <span>📚</span> Course Information
            </h2>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <Field label="Institution Name"       value={instit}    onChange={setInstit}    />
              <Field label="Course Code"            value={code}      onChange={setCode}      />
              <Field label="Course Name"            value={cname}     onChange={setCname}     />
              <Field label="Academic Year"          value={year}      onChange={setYear}      />
              <Field label="Semester"               value={sem}       onChange={setSem}       type="number" min={1} max={3} />
              <Field label="Number of Teaching Weeks" value={weeks}   onChange={setWeeks}     type="number" min={1} max={20} />
              <div className="sm:col-span-2">
                <Field label="Academic Session Start Date" value={startDate} onChange={setStartDate} type="date" />
              </div>
            </div>

            <div className="flex items-center gap-3 pt-1">
              <button
                onClick={handleSaveCourse}
                className="px-5 py-2 text-sm font-medium bg-[#1e3a5f] text-white rounded-lg hover:bg-[#16304f] transition-colors"
              >
                Save
              </button>
              {savedCourse && (
                <span className="text-sm text-green-600 font-medium">✓ Saved!</span>
              )}
            </div>
          </div>

          {/* ── SECTION 2: Assessment Weights ─────────────────────────── */}
          <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
            <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
              <span>🎓</span> Assessment Weights
            </h2>

            <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-xs text-amber-700">
              ⚠️ These weights are for demonstration purposes only.
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              {[
                { label:'Quiz',         value:wQuiz, setter:setWQuiz },
                { label:'Assignment',   value:wAsgn, setter:setWAsgn },
                { label:'Project',      value:wProj, setter:setWProj },
                { label:'Presentation', value:wPres, setter:setWPres },
              ].map(({ label, value, setter }) => (
                <div key={label}>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">{label} %</label>
                  <input
                    type="number" min={0} max={100} value={value}

                  />
                </div>

            </div>

            <div className={`flex items-center justify-between rounded-lg px-4 py-2 text-sm font-semibold
              ${wValid ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'}`}>
              <span>Total: {wTotal}%</span>
              {wValid ? <span className="text-xs">✓ Valid</span> : <span className="text-xs font-semibold">Weights must sum to 100%</span>}
            </div>

            <div className="flex items-center gap-3 pt-1">
              <button onClick={handleResetWeights}
                className="text-xs text-slate-500 hover:text-slate-700 underline font-medium">
                Reset to Default
              </button>
              <div className="flex-1" />
              <button

                disabled={!wValid}
                className={`px-5 py-2 text-sm font-medium rounded-lg transition-colors
                  ${wValid ? 'bg-[#1e3a5f] text-white hover:bg-[#16304f]' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
              >
                Save Weights
              </button>
              {savedWeights && (
                <span className="text-sm text-green-600 font-medium">✓ Saved!</span>
              )}
            </div>
          </div>

          {/* ── SECTION 3: Appearance ─────────────────────────────────── */}
          <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
            <h2 className="text-base font-bold text-slate-800 flex items-center gap-2">
              <span>🎨</span> Appearance
            </h2>

            <p className="text-xs text-slate-500">Select a colour theme for the dashboard.</p>

            <div className="flex gap-4">
              {[
                { val:'light', label:'☀️ Light', desc:'White background, navy sidebar' },
                { val:'dark',  label:'🌙 Dark',  desc:'Dark slate background' },
              ].map(opt => (
                <label key={opt.val}
                  className={`flex-1 flex flex-col gap-1 cursor-pointer rounded-xl border-2 p-4 transition-colors

                  <div className="flex items-center gap-2">

                <div>
                  <p className="text-sm font-semibold text-slate-700">Reset Demo Data</p>
                  <p className="text-xs text-slate-400">Reload original demo data</p>
                </div>
              </button>

              {/* Export */}
              <button
                onClick={handleExport}
                className="flex items-center gap-3 px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-left transition-colors"
              >
                <span className="text-xl">📤</span>
                <div>
                  <p className="text-sm font-semibold text-slate-700">Export All Data (JSON)</p>
                  <p className="text-xs text-slate-400">Download a full backup file</p>
                </div>
              </button>

              {/* Import */}
              <button
                onClick={() => { setImportError(''); fileInputRef.current && fileInputRef.current.click(); }}
                className="flex items-center gap-3 px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-left transition-colors"
              >
                <span className="text-xl">📥</span>
                <div>
                  <p className="text-sm font-semibold text-slate-700">Import Data (JSON)</p>
                  <p className="text-xs text-slate-400">Replace all data from a backup</p>
                </div>
              </button>
              <input ref={fileInputRef} type="file" accept=".json,application/json"
                className="hidden" onChange={handleImportFile} />

              {/* Clear All */}
              <button
                onClick={() => setConfirmModal({
                  type: 'clear',
                  message: 'This will erase ALL data permanently. The app will be empty until you reset demo data.',
                  onConfirm: () => {
                    DEP_KEYS.forEach(k => localStorage.removeItem(k));
                    window.location.reload();
                  },
                })}
                className="flex items-center gap-3 px-4 py-3 rounded-xl border border-red-200 bg-red-50 hover:bg-red-100 text-left transition-colors"
              >
                <span className="text-xl">🗑️</span>
                <div>
                  <p className="text-sm font-semibold text-red-700">Clear All Data</p>
                  <p className="text-xs text-red-400">Permanently erase all localStorage data</p>
                </div>
              </button>
            </div>

            {importError && (
              <p className="text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">{importError}</p>
            )}
          </div>

          {/* Confirm Modal */}
          {confirmModal && (
            <ConfirmModal modal={confirmModal} onClose={() => setConfirmModal(null)} />
          )}
        </div>
      );
    }

    function SettingsPage() {
      const { role } = useApp();
      return role === 'student' ? <StudentSettingsView /> : <LecturerSettingsView />;
    }

    /* =====================================================================
     *  Page Router
     * ===================================================================== */
    function PageRouter() {
      const { activePage } = useApp();
      switch (activePage) {
        case 'overview':    return <OverviewPage />;
        case 'students':    return <StudentsPage />;
        case 'projects':    return <ProjectsPage />;
        case 'sales':       return <SalesAnalyticsPage />;
        case 'weekly':      return <WeeklyProgressPage />;
        case 'assessments': return <AssessmentsPage />;
        case 'reports':     return <ReportsPage />;
        case 'settings':    return <SettingsPage />;
        default:            return <OverviewPage />;
      }
    }

    /* =====================================================================
     *  MainLayout
     * ===================================================================== */
    function MainLayout() {
      const { sidebarOpen } = useApp();

      return (
        <div className="flex h-screen bg-[#f8fafc] overflow-hidden">
          <Sidebar />

          {/* Right column: shifts right by sidebar width on md+ */}
          <div
            className={`flex flex-col flex-1 min-w-0 transition-all duration-200
              ${sidebarOpen ? 'md:ml-60' : 'md:ml-16'}`}
          >
            <TopHeader />
            <main className="flex-1 overflow-y-auto p-6">
              <PageRouter />
            </main>
          </div>
        </div>
      );
    }

    /* =====================================================================
     *  App root
     * ===================================================================== */
    function App() {
      const { role } = useApp();

      // Apply persisted theme on mount; also hide the loading splash
      React.useEffect(() => {
        const loadingEl = document.getElementById('loading');
        if (loadingEl) loadingEl.style.display = 'none';
        const saved = localStorage.getItem('dep_theme');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark-mode');
        } else {
          document.documentElement.classList.remove('dark-mode');
        }
      }, []);

      return role ? <MainLayout /> : <LoginScreen />;
    }

    // ------------------------------------------------------------------
    // Bootstrap
    // ------------------------------------------------------------------
    seedLocalStorage();
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
